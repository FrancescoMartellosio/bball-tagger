<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Basketball Stats — Gathering App</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tagger">
<style>
  :root {
    --bg: #0f1216;
    --surface: #1b1f27;
    --surface-2: #262b35;
    --border: #34394510;
    --text: #f2f3f5;
    --text-dim: #9aa1ac;
    --accent: #3b82f6;
    --accent-2: #f59e0b;
    --good: #22c55e;
    --bad: #ef4444;
    --team-home: #3b82f6;
    --team-away: #ef4444;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior-y: contain;
  }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  h1, h2, h3 { margin: 0 0 8px 0; }
  .screen { flex: 1; display: flex; flex-direction: column; padding: 16px; padding-bottom: 32px; max-width: 560px; margin: 0 auto; width: 100%; }
  .hidden { display: none !important; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: var(--radius);
    color: var(--text);
    background: var(--surface-2);
    padding: 14px 16px;
    font-size: 16px;
    touch-action: manipulation;
  }
  button:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: white; font-weight: 600; }
  .btn-danger { background: var(--bad); color: white; }
  .btn-ghost { background: transparent; border: 1px solid #ffffff22; color: var(--text-dim); }
  .btn-block { width: 100%; }
  .btn-lg { padding: 18px; font-size: 18px; }

  label { display: block; font-size: 14px; color: var(--text-dim); margin: 12px 0 6px; }
  input[type=text], input[type=date], input[type=number], select {
    width: 100%; padding: 12px 14px; font-size: 16px;
    border-radius: var(--radius); border: 1px solid #ffffff22;
    background: var(--surface); color: var(--text);
  }

  .card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }

  .roster-own-actions { display: flex; gap: 8px; margin-top: 8px; }
  .roster-own-actions button { flex: 1; }
  .roster-team-card .team-name-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .roster-team-card .team-name-row input { flex: 1; font-weight: 700; }
  .roster-player-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 40px; gap: 6px; margin-bottom: 6px; }
  .roster-player-row input { min-width: 0; }
  .roster-player-row input.num { text-align: center; font-variant-numeric: tabular-nums; }
  .roster-remove-btn { padding: 0; color: var(--bad); background: transparent; }
  .setup-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .lang-switch { display: flex; gap: 4px; flex-shrink: 0; }
  .lang-switch button { min-height: 32px; padding: 4px 10px; font-size: 13px; }
  .lang-switch button.selected { background: var(--accent); color: white; border-color: var(--accent); }
  .team-pick-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .team-pick-row button { flex: 1 1 120px; min-width: 0; }
  .team-pick-row button.selected { background: var(--accent); color: white; }
  .foul-type-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; }
  .foul-type-row button { min-height: 40px; padding: 6px 4px; font-size: 13px; overflow-wrap: anywhere; }
  .foul-type-row button.selected { background: var(--accent-2); color: #111; font-weight: 700; }
  .team-pick-row button:disabled { background: var(--bg); color: var(--text-dim); opacity: 0.6; cursor: not-allowed; }

  /* Tagging screen */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); padding-bottom: 10px;
    /* 2x2 on phones — period + Undo (the mid-play controls) on top, Stats + Finish below —
       one row once there's room for all four. */
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: stretch; gap: 8px;
  }
  .topbar > button { padding: 12px 10px; font-size: 15px; white-space: nowrap; }
  .period-control { justify-content: space-between; }
  @media (min-width: 520px) {
    .topbar { grid-template-columns: auto 1fr 1fr 1.4fr; }
  }
  .period-control { display: flex; align-items: center; gap: 6px; background: var(--surface); border-radius: var(--radius); padding: 6px 10px; }
  .period-control span { min-width: 40px; text-align: center; font-weight: 600; }
  .period-control button { padding: 8px 12px; font-size: 18px; }
  .period-control button:disabled { opacity: .35; }

  .scoreboard {
    display: flex; align-items: baseline; justify-content: center; gap: 8px;
    background: var(--surface); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px;
  }
  .scoreboard-name {
    font-size: 13px; font-weight: 600; color: var(--text-dim);
    max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .scoreboard-value { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .scoreboard-value.team-home { color: var(--team-home); }
  .scoreboard-value.team-away { color: var(--team-away); }
  .scoreboard-sep { color: var(--text-dim); font-size: 20px; }

  .team-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .team-tabs button { flex: 1; background: var(--surface); }
  .team-tabs button.team-home.active { background: var(--team-home); color: white; }
  .team-tabs button.team-away.active { background: var(--team-away); color: white; }

  .player-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .player-btn { background: var(--surface); text-align: left; padding: 16px 12px; min-height: 64px; border-left: 4px solid transparent; min-width: 0; }
  .player-grid.team-context-home .player-btn { border-left-color: var(--team-home); }
  .player-grid.team-context-away .player-btn { border-left-color: var(--team-away); }
  .player-btn .jersey { color: var(--text-dim); font-size: 13px; }
  .player-btn .name { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
  .player-btn.by-number .name { font-size: 26px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .player-btn.selected { background: var(--accent); color: white; }
  .player-btn.selected .jersey { color: #ffffffcc; }
  .player-grid.team-context-home .player-btn.selected { background: var(--team-home); }
  .player-grid.team-context-away .player-btn.selected { background: var(--team-away); }

  .score-only-note { color: var(--text-dim); text-align: center; padding: 20px 0; }
  .score-only-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .score-only-row button { flex: 1 1 100px; min-height: 64px; font-size: 20px; font-weight: 700; }

  .section-title { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); margin: 8px 0; }

  .log-entry {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 8px;
    border-left: 4px solid transparent;
  }
  .log-entry.team-home { border-left-color: var(--team-home); }
  .log-entry.team-away { border-left-color: var(--team-away); }
  .log-entry .meta { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
  .log-entry .desc { font-weight: 600; }
  .log-entry .del-btn { background: transparent; color: var(--bad); padding: 6px 10px; font-size: 20px; line-height: 1; }
  .log-entry .period-btn {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border, currentColor);
    border-radius: 6px; padding: 0 6px; font-size: 13px; line-height: 1.6; min-height: unset;
  }
  .empty-log { color: var(--text-dim); text-align: center; padding: 20px 0; }
  .log-btn { margin-top: 16px; }
  .log-divider {
    font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--text-dim);
    margin: 14px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #ffffff1f;
  }
  .log-divider:first-child { margin-top: 0; }
  .log-pause { font-size: 12px; color: var(--accent-2); text-align: center; margin: -2px 0 8px; }
  .pause-nudge {
    background: var(--surface); border-radius: var(--radius); border-left: 4px solid var(--accent-2);
    padding: 10px 14px; margin-bottom: 12px; font-size: 14px;
  }
  .pause-nudge-actions { display: flex; gap: 8px; margin-top: 8px; }
  .pause-nudge-actions button { flex: 1; padding: 8px 10px; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: #000000aa;
    display: flex; align-items: flex-end; justify-content: center; z-index: 20;
  }
  .modal-sheet {
    background: var(--surface); width: 100%; max-width: 560px;
    border-radius: 16px 16px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    /* A sheet taller than the screen (e.g. Substitutions with a long bench) would otherwise
       push its top off-screen, unreachable — cap it and let it scroll inside itself. dvh
       tracks mobile browser toolbars; vh is the fallback for browsers without it. */
    max-height: 92vh; max-height: 92dvh;
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  }
  /* Pinned to the bottom of a scrolling sheet, so its action is always one tap away. */
  .sheet-footer {
    position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom));
    background: var(--surface); margin: 14px -16px calc(-20px - env(safe-area-inset-bottom));
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid #ffffff14;
  }
  .modal-title { font-size: 15px; color: var(--text-dim); margin-bottom: 14px; }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-grid button { min-height: 56px; font-size: 17px; font-weight: 600; }
  .modal-list { display: flex; flex-direction: column; gap: 8px; }
  .modal-list button { text-align: left; min-height: 52px; }
  .modal-list.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .modal-list.two-col button { min-height: 48px; padding: 10px 12px; font-size: 15px; overflow-wrap: anywhere; }
  .modal-list.two-col .empty-log { grid-column: 1 / -1; }
  .modal-list button:disabled { opacity: .4; cursor: not-allowed; }
  .modal-list button.selected { background: var(--accent); color: white; }
  .modal-list.team-context-home button.selected { background: var(--team-home); }
  .modal-list.team-context-away button.selected { background: var(--team-away); }
  .modal-grid .sub-btn { grid-column: 1 / -1; min-height: 48px; background: var(--surface-2); }

  .zone-fallback-row { display: flex; gap: 10px; margin-top: 12px; }
  .zone-fallback-row button { flex: 1; }

  /* Half-court diagram drawn by both shot pickers (shared.js renderCourtLines). */
  .court-map { width: 100%; height: auto; display: block; margin: 4px 0 2px; touch-action: manipulation; background: var(--surface-2); border-radius: 8px; }
  .court-line { stroke: var(--text-dim); stroke-width: 0.3; fill: none; pointer-events: none; stroke-linecap: round; stroke-linejoin: round; }
  .court-line-three { stroke: var(--accent-2); stroke-width: 0.5; fill: none; pointer-events: none; stroke-linecap: round; }

  .zone-fallback-row.hidden { display: none; }

  .court-bg { fill: transparent; cursor: pointer; }
  .court-marker { fill: var(--accent); stroke: #fff; stroke-width: 0.3; pointer-events: none; }
  .court-readout { text-align: center; color: var(--text-dim); font-size: 14px; margin: 8px 0 0; min-height: 20px; }

  .made-btn { background: var(--good); color: #06210f; }
  .missed-btn { background: #3a1f1f; color: var(--text); }
  .reb-btn { background: var(--surface-2); }
  .turnover-btn { background: var(--surface-2); }

  .finish-bar { margin-top: 12px; }

  .squad-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .squad-toolbar .section-title { flex: 1; }
  .squad-toolbar button { padding: 8px 14px; font-size: 14px; }
  .player-grid.compact { gap: 8px; }
  .player-grid.compact .player-btn { min-height: 48px; padding: 10px 12px; }
  .player-grid.compact .player-btn .name { font-size: 15px; }

  .storage-warning {
    background: var(--bad); color: white; font-size: 14px; font-weight: 600;
    padding: 10px 16px; text-align: center;
  }
  .roster-status { margin: 0 0 10px; font-size: 14px; }
  .file-btn {
    display: block; text-align: center; padding: 14px 16px; margin: 0;
    border-radius: var(--radius); font-size: 16px; color: var(--text); cursor: pointer;
  }
  .file-btn input { display: none; }
  #undo-btn:disabled { opacity: .35; }

  footer.hint { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 24px; }
  .variant-switch { margin-top: 10px; font-size: 14px; }
  .variant-switch a { color: var(--accent); }
  .build-id { margin-top: 8px; opacity: .6; font-variant-numeric: tabular-nums; }
  .link-btn { display: block; box-sizing: border-box; text-align: center; text-decoration: none; }

  /* Stats overlay */
  #stats-overlay {
    position: fixed; inset: 0; z-index: 30;
    background: var(--bg); color: var(--text);
    overflow-y: auto; padding: 16px; padding-bottom: 32px;
  }
  .stats-overlay-inner { max-width: 720px; margin: 0 auto; }
  .stats-header { display: flex; gap: 10px; margin-bottom: 16px; }
  .stats-header button { flex: 1; }
  .stats-score-line { text-align: center; font-size: 22px; font-weight: 800; margin-bottom: 20px; }
  .stats-scroll { overflow-x: auto; margin-bottom: 24px; }
  .stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .stats-table td { white-space: nowrap; }
  .stats-table td.pct { color: var(--text-dim); }
  .stats-table caption { text-align: left; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .stats-table th, .stats-table td { border: 1px solid var(--border, #ffffff22); padding: 5px 7px; text-align: right; }
  .stats-table th:first-child, .stats-table td:first-child { text-align: left; }
  .stats-table thead th { background: var(--surface-2); white-space: nowrap; }
  .stats-table tr.totals-row { font-weight: 700; background: var(--surface); }

  @page { size: A4 landscape; margin: 12mm; }
  @media print {
    /* display, not visibility: a visibility-hidden screen still takes up its full height, so a
       long event log printed as a run of blank pages ahead of the box score. */
    body > *:not(#stats-overlay) { display: none !important; }
    body { background: white; }
    #stats-overlay { position: static; overflow: visible; background: white; color: black; padding: 0; }
    .no-print { display: none !important; }
    .stats-scroll { overflow: visible; }
    .stats-table { font-size: 10px; }
    .stats-table th, .stats-table td { border-color: #999; color: black; padding: 3px 4px; }
    .stats-table thead th, .stats-table tr.totals-row { background: #eee; }
  }
</style>
</head>
<body>

<!-- MAINTAINER: this file is built, not hand-edited. It's assembled in two steps:
       1. python3 build.py           — assembles gathering-app/src/* into this file (and its
                                        sibling index-freeform.html) from shared source, so the
                                        two variants (tap-a-zone vs tap-an-exact-spot) don't
                                        drift out of sync with each other by hand.
       2. python3 generate.py roster.json  — embeds a roster.json (downloaded from the
                                        Analytics Project's Roster page) into a COPY of this
                                        file to produce game-tagger.html, which is what actually
                                        gets shared with a contributor. Do not change this tag's
                                        id or type — generate.py finds it by exact string match. -->
<script type="application/json" id="roster-data">
{"hosted": true}
</script>

<!-- Shown when this browser won't let the page save anything (see storageOk in shared.js). -->
<div id="storage-warning" class="storage-warning hidden" data-i18n="storage.warning"></div>

<!-- ============ Screen 1: Match setup ============ -->
<div id="setup-screen" class="screen">
  <div class="setup-header">
    <h1 data-i18n="setup.title"></h1>
    <!-- Filled from LANGUAGES in i18n.js (see renderLanguageSwitch). -->
    <div class="lang-switch" id="lang-switch"></div>
  </div>

  <!-- Hosted build only (see IS_HOSTED in shared.js): the roster isn't embedded, the
       contributor loads the roster.json they were sent. -->
  <div id="roster-card" class="card hidden">
    <label style="margin-top:0;" data-i18n="setup.roster"></label>
    <p id="roster-status" class="roster-status"></p>
    <label class="btn-ghost btn-block file-btn">
      <span data-i18n="setup.loadRoster"></span>
      <input type="file" id="roster-file-input" accept=".json,application/json">
    </label>
    <p id="roster-error" class="hidden" style="color:var(--bad); margin:8px 0 0;"></p>
    <!-- A roster typed in here instead of loaded (see the roster editor below). -->
    <button id="roster-create-btn" class="btn-ghost btn-block" style="margin-top:8px;" data-i18n="rosterEdit.create"></button>
    <div id="roster-own-actions" class="roster-own-actions hidden">
      <button id="roster-edit-btn" class="btn-ghost" data-i18n="rosterEdit.edit"></button>
      <button id="roster-download-btn" class="btn-ghost" data-i18n="rosterEdit.download"></button>
    </div>
  </div>

  <div class="card">
    <label data-i18n="setup.playedOn"></label>
    <input type="date" id="played-on-input">

    <label data-i18n="setup.taggerName"></label>
    <input type="text" id="tagger-name-input" data-i18n-placeholder="setup.taggerNamePlaceholder">

    <label data-i18n="setup.home"></label>
    <div id="home-team-picker"></div>

    <div id="away-team-section">
      <label data-i18n="setup.away"></label>
      <div id="away-team-picker"></div>
    </div>

    <label data-i18n="setup.competition"></label>
    <select id="competition-select"></select>

    <!-- Names or jersey numbers on the tagging screen (see labelMode in shared.js). -->
    <label data-i18n="setup.labels"></label>
    <div id="label-mode-picker"></div>
  </div>

  <button id="start-match-btn" class="btn-primary btn-block btn-lg" data-i18n="setup.start"></button>
  <p id="setup-error" class="hidden" style="color:var(--bad); text-align:center; margin-top:10px;"></p>

  <footer class="hint">
    <span data-i18n="setup.offline"></span>
    <!-- Hosted build only: link to the other shot-picker variant's page (see renderVariantSwitch). -->
    <div id="variant-switch" class="variant-switch hidden"></div>
    <!-- Filled in by build.py (compute_build_id) — tells you which build a phone is running. -->
    <div class="build-id">build 5bb7807</div>
  </footer>
</div>

<!-- ============ Screen 1.1: Roster editor (hosted build only) ============ -->
<!-- For a game the analytics side has no roster for: teams and players typed in on the phone.
     Jersey number required, name optional. The resulting roster is flagged tagger_made, so every
     export carries it (tagger_roster) and the analytics import can match or create its teams and
     players. See renderRosterEditor in shared.js. -->
<div id="roster-screen" class="screen hidden">
  <h1 data-i18n="rosterEdit.title"></h1>
  <p style="color:var(--text-dim); font-size:14px; margin:-8px 0 12px;" data-i18n="rosterEdit.hint"></p>
  <div id="roster-editor"></div>
  <button id="roster-add-team-btn" class="btn-ghost btn-block" style="margin-bottom:16px;" data-i18n="rosterEdit.addTeam"></button>
  <button id="roster-save-btn" class="btn-primary btn-block btn-lg" data-i18n="rosterEdit.save"></button>
  <button id="roster-back-btn" class="btn-ghost btn-block" style="margin-top:10px;" data-i18n="common.back"></button>
  <p id="roster-editor-error" class="hidden" style="color:var(--bad); text-align:center; margin-top:10px;"></p>
</div>

<!-- ============ Screen 1.25: Who's playing today (matchday squad) ============ -->
<!-- Only tracked teams — a score-only side has no people to pick. Only the players ticked here
     are offered for the starting lineup and on the Substitutions bench; the squad is exported
     so the analytics side can show DNPs (see squadIds in shared.js). -->
<div id="squad-screen" class="screen hidden">
  <h1 data-i18n="squad.title"></h1>
  <p style="color:var(--text-dim); font-size:14px; margin:-8px 0 4px;" data-i18n="squad.hint"></p>

  <div class="team-tabs" id="squad-team-tabs"></div>
  <div class="squad-toolbar">
    <div class="section-title" id="squad-count-label"></div>
    <button id="squad-all-btn" class="btn-ghost" data-i18n="squad.all"></button>
    <button id="squad-none-btn" class="btn-ghost" data-i18n="squad.none"></button>
  </div>
  <div class="player-grid compact" id="squad-grid"></div>

  <button id="squad-continue-btn" class="btn-primary btn-block btn-lg finish-bar" data-i18n="squad.next"></button>
  <button id="squad-back-btn" class="btn-ghost btn-block" style="margin-top:10px;" data-i18n="common.back"></button>
  <p id="squad-error" class="hidden" style="color:var(--bad); text-align:center; margin-top:10px;"></p>
</div>

<!-- ============ Screen 1.5: Starting lineups ============ -->
<div id="starters-screen" class="screen hidden">
  <h1 data-i18n="starters.title"></h1>
  <p style="color:var(--text-dim); font-size:14px; margin:-8px 0 4px;" data-i18n="starters.hint"></p>

  <div class="team-tabs" id="starters-team-tabs"></div>
  <div class="section-title" id="starters-count-label"></div>
  <div class="player-grid" id="starters-grid"></div>
  <p id="starters-score-only-note" class="hidden score-only-note" data-i18n="starters.scoreOnly"></p>

  <button id="starters-continue-btn" class="btn-primary btn-block btn-lg finish-bar" data-i18n="starters.start"></button>
  <button id="starters-back-btn" class="btn-ghost btn-block" style="margin-top:10px;" data-i18n="common.back"></button>

    <span class="scoreboard-name" id="score-away-name"></span>

    <button id="score-only-ft-btn" class="made-btn" data-i18n="tag.ftButton"></button>

  </div>
</div>

<!-- ============ Modal: linked attribution picker ============ -->
<!-- Shared by three flows, each one live-ball episode with two protagonists on different
     teams: Steal -> who lost the ball (logs a linked turnover, since undercounting team
     turnovers by relying on a separate manual tap is a real risk); Foul -> who drew it;
     Block -> whose shot. "Skip" logs just the primary event; "Cancel" logs nothing. -->
<div id="link-modal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <!-- Foul only: the foul's type, preselected to Personal so the common case is still one tap
         on who drew it. Filled from FOUL_TYPES in shared.js. -->

    <div class="modal-title" id="link-modal-title"></div>
    <div class="modal-list" id="link-list"></div>
    <button id="link-skip-btn" class="btn-primary btn-block" style="margin-top:12px;"></button>
    <button id="link-cancel-btn" class="btn-ghost btn-block" style="margin-top:8px;" data-i18n="common.cancel"></button>
  </div>
</div>

<!-- ============ Modal: substitutions ============ -->
<div id="subs-modal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div class="modal-title" data-i18n="subs.title"></div>

    <div class="section-title" id="subs-oncourt-title"></div>
    <div class="modal-list two-col" id="subs-oncourt-list"></div>
    <div class="section-title" style="margin-top:14px;" id="subs-bench-title"></div>
    <div class="modal-list two-col" id="subs-bench-list"></div>

    <!-- A late arrival, or someone left out of "Who's playing today?" by mistake. -->
    <button id="subs-extra-toggle" class="btn-ghost btn-block hidden" style="margin-top:12px;"></button>
    <div class="modal-list two-col hidden" id="subs-extra-list" style="margin-top:8px;"></div>
    <div class="sheet-footer">
      <button id="subs-done-btn" class="btn-primary btn-block" data-i18n="common.done"></button>
    </div>
  </div>
</div>

<!-- ============ Modal: event log ============ -->
<!-- Before #confirm-modal so a delete confirm opened from here stacks on top of it. -->
<div id="log-modal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div class="modal-title" data-i18n="tag.eventLog"></div>
    <div id="event-log"></div>
    <div class="sheet-footer">
      <button id="log-close-btn" class="btn-primary btn-block" data-i18n="stats.close"></button>

    </div>
  </div>
</div>

<div id="recovery-modal" class="modal-overlay hidden">

    <button id="recovery-discard-btn" class="btn-ghost btn-block" data-i18n="recovery.discard"></button>

  var lang = (function () {

  // t("squad.count", { n: 3, total: 10 }) -> "3 di 10 convocati". Falls back to English, then
  // to the key itself, so a missing translation shows up as visibly odd text, not a crash.
  function t(key, params) {
    var s = STRINGS[lang][key];
    if (s === undefined) s = STRINGS.en[key];
    if (s === undefined) return key;
    if (params) {
      s = s.replace(/\{(\w+)\}/g, function (m, name) {
        return params[name] !== undefined ? String(params[name]) : m;
      });
    }
    return s;
  }

  function applyStaticTranslations() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
      el.placeholder = t(el.getAttribute("data-i18n-placeholder"));
    });
    document.querySelectorAll("[data-i18n-title]").forEach(function (el) {
      el.title = t(el.getAttribute("data-i18n-title"));
    });
  }

  function setLanguage(id) {
    if (!STRINGS[id]) return;
    lang = id;
    try { window.localStorage.setItem(LANG_STORAGE_KEY, id); } catch (e) {}
    applyStaticTranslations();
  }

  var STORAGE_KEY = "bball_gathering_state_v1";
  var ROSTER_STORAGE_KEY = "bball_roster_v1";
  // { teamId: [playerId, ...] } — each team's last "Who's playing today?" squad on this device,
  // the starting point for its next match (squads rarely change much from game to game).
  var LAST_SQUAD_STORAGE_KEY = "bball_last_squad_v1";

  // ---------- Storage ----------
  // localStorage can be missing or throw outright (Android WebViews with DOM storage off,
  // some private modes, a full quota) — every access goes through these wrappers so that
  // degrades to "works, but only in memory" with a visible warning instead of a dead app.
  var storageOk = (function () {
    try {
      var probe = "__bball_probe__";
      window.localStorage.setItem(probe, "1");
      window.localStorage.removeItem(probe);
      return true;
    } catch (e) { return false; }
  })();
  var storageWarning = document.getElementById("storage-warning");

  function showStorageWarning() {
    storageWarning.classList.remove("hidden");
  }

  function storageGet(key) {
    if (!storageOk) return null;
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function storageSet(key, value) {
    if (!storageOk) return;
    try { window.localStorage.setItem(key, value); } catch (e) { showStorageWarning(); }
  }
  function storageRemove(key) {
    if (!storageOk) return;
    try { window.localStorage.removeItem(key); } catch (e) {}
  }
  if (!storageOk) showStorageWarning();

  // ---------- Roster ----------
  // A tagger generated by generate.py has its roster embedded. The hosted build (build.py's
  // site/ output, served over https for iPhones) instead embeds {"hosted": true} with no names,
  // so no player data ever sits on a public URL — the contributor loads a roster.json file on
  // the device, and it's kept in storage from then on.
  var EMBEDDED_ROSTER = JSON.parse(document.getElementById("roster-data").textContent);
  var IS_HOSTED = !!EMBEDDED_ROSTER.hosted;
  var EMPTY_ROSTER = { teams: [], players: [], competitions: [] };

  var ROSTER = EMPTY_ROSTER;
  var teamsById = {};
  var playersById = {};
  // A team flagged score_only in the embedded roster (see
  // analytics-project/roster.py::export_single_team_roster_json) represents an opponent who
  // hasn't consented to being recorded, or isn't worth rostering: no roster, no starting
  // lineup, no per-player attribution — just a running score. It's still a real team with one
  // placeholder player (so a +2/+3/+1 tap is a perfectly ordinary, schema-legal event), the
  // UI just never lets the tagger treat it like a full roster.
  var isScoreOnly = {};

  function applyRoster(roster) {
    ROSTER = roster;
    teamsById = {};
    playersById = {};
    isScoreOnly = {};
    ROSTER.teams.forEach(function (team) {
      teamsById[team.id] = team;
      isScoreOnly[team.id] = !!team.score_only;
    });
    ROSTER.players.forEach(function (p) { playersById[p.id] = p; });
  }

  // Client-side counterpart of generate.py::validate_roster, for a roster.json loaded on the
  // device (the hosted build) — only the checks the tagger itself depends on not crashing.
  function validateRoster(r) {
    if (!r || typeof r !== "object" || !Array.isArray(r.teams) || !Array.isArray(r.players)) {
      return t("roster.notRoster");
    }
    if (r.teams.length < 2) return t("roster.twoTeams");
    var teamIds = {};
    for (var i = 0; i < r.teams.length; i++) {
      var team = r.teams[i];
      if (!team || !team.id || !team.name) return t("roster.teamMissing", { n: i + 1 });
      teamIds[team.id] = true;
    }
    for (var j = 0; j < r.players.length; j++) {
      var p = r.players[j];
      // A roster made on the tagger may leave a name out, but then the number identifies them.
      var identified = p && (p.name || Number.isInteger(p.jersey_number));
      if (!p || !p.id || !identified || !p.team_id) return t("roster.playerMissing", { n: j + 1 });
      if (!teamIds[p.team_id]) return t("roster.unknownTeam", { name: subsLabel(p) });
    }
    var fullTeams = r.teams.filter(function (team) { return !team.score_only; });
    if (fullTeams.length === 0) return t("roster.noFullTeam");
    if (r.competitions !== undefined && !Array.isArray(r.competitions)) return t("roster.competitionsList");
    return null;
  }

  function loadInitialRoster() {
    if (!IS_HOSTED) return EMBEDDED_ROSTER;
    var raw = storageGet(ROSTER_STORAGE_KEY);
    if (!raw) return EMPTY_ROSTER;
    try {
      var stored = JSON.parse(raw);
      return validateRoster(stored) ? EMPTY_ROSTER : stored;
    } catch (e) { return EMPTY_ROSTER; }
  }
  applyRoster(loadInitialRoster());

  // ---------- Player labels ----------
  // How players are shown once tagging starts: by name (the default) or by jersey number,
  // which is what a tagger actually reads off the court. Per device, switched on the setup
  // screen. Either way the other half is shown smaller alongside, and a player missing the
  // chosen half (no number in the roster, or no name in a roster made on the tagger) falls
  // back to the other.
  var LABEL_MODE_STORAGE_KEY = "bball_label_mode_v1";
  var labelMode = storageGet(LABEL_MODE_STORAGE_KEY) === "number" ? "number" : "name";

  function jerseyText(p) {
    return p.jersey_number !== null && p.jersey_number !== undefined ? "#" + p.jersey_number : "";
  }

  // [primary, secondary] for the chosen mode; secondary may be "".
  function playerLabelParts(p) {
    var num = jerseyText(p), name = p.name || "";
    if (labelMode === "number") return num ? [num, name] : [name, ""];
    return name ? [name, num] : [num, ""];
  }

  // One compact label: event log lines, confirmations, modal titles.
  function playerShort(p) {
    return playerLabelParts(p)[0];
  }

  // Both halves on one line: pick lists (assist, drawn by, ...).
  function playerFull(p) {
    var parts = playerLabelParts(p);
    if (!parts[1]) return parts[0];
    return labelMode === "number" ? parts[0] + " " + parts[1] : parts[0] + " (" + parts[1] + ")";
  }

  function fillPlayerButton(btn, p) {
    var parts = playerLabelParts(p);
    btn.classList.toggle("by-number", labelMode === "number" && parts[0].charAt(0) === "#");
    btn.innerHTML = '<div class="name">' + escapeHtml(parts[0]) + '</div>' +
                    (parts[1] ? '<div class="jersey">' + escapeHtml(parts[1]) + '</div>' : "");
  }

  function playersForTeam(teamId) {
    return ROSTER.players.filter(function (p) { return p.team_id === teamId; });

  var SVG_NS = "http://www.w3.org/2000/svg";

  function svgEl(tag, attrs) {
    var el = document.createElementNS(SVG_NS, tag);
    for (var key in attrs) { el.setAttribute(key, attrs[key]); }
    return el;

  // ---------- Court geometry (both shot pickers) ----------
  // Same real-world proportions (feet) as analytics-project/zones.py and ui.py's
  // shot_zone_court_chart, so both pickers look like the analytics-side shot chart. Pickers
  // draw in a "0 0 50 32" viewBox — 1 SVG unit = 1 foot, so a tapped point's SVG-space
  // coordinates ARE the feet coordinates directly, no scale conversion needed.
  var COURT_HOOP = [25, 5.25];
  var COURT_RA_R = 4;
  var COURT_THREE_R = 23.75;
  var COURT_KEY_X0 = 17, COURT_KEY_X1 = 33, COURT_KEY_Y1 = 19;
  var COURT_FT_CIRCLE_R = 6;
  var COURT_CORNER_X0 = 3, COURT_CORNER_X1 = 47;
  var COURT_TOP = 32;

  function courtArcPoints(cx, cy, r, theta1Deg, theta2Deg, n) {
    // Logical coordinates (y increasing away from the baseline) — NOT pre-flipped for screen
    // space. The single <g> flip in renderCourtMap() handles that for every element uniformly,
    // this and everything else just deals in logical court coordinates.
    var pts = [];
    for (var i = 0; i <= n; i++) {
      var theta = (theta1Deg + (theta2Deg - theta1Deg) * i / n) * Math.PI / 180;
      pts.push([cx + r * Math.cos(theta), cy + r * Math.sin(theta)]);
    }
    return pts;
  }

  function courtThetaAtX(cx, cy, r, x) {
    var dx = x - cx;
    var dy = Math.sqrt(Math.max(r * r - dx * dx, 0));
    return Math.atan2(dy, dx) * 180 / Math.PI;
  }

  function courtPathFrom(points) {
    return "M " + points.map(function (p) { return p[0].toFixed(2) + "," + p[1].toFixed(2); }).join(" L ");
  }

  // Same rule the real 3PT line follows: a fixed corner cutoff (the line runs straight near
  // the sideline, not on the arc, since the arc would dip out of bounds there) plus the arc
  // radius everywhere else.
  function isThreePointer(x, y) {
    if (x < COURT_CORNER_X0 || x > COURT_CORNER_X1) return true;
    var dx = x - COURT_HOOP[0], dy = y - COURT_HOOP[1];
    return Math.sqrt(dx * dx + dy * dy) >= COURT_THREE_R;
  }

  function renderCourtLines(container) {
    var hx = COURT_HOOP[0], hy = COURT_HOOP[1];
    var thetaCornerL = courtThetaAtX(hx, hy, COURT_THREE_R, COURT_CORNER_X0);
    var thetaCornerR = courtThetaAtX(hx, hy, COURT_THREE_R, COURT_CORNER_X1);
    var cornerY = hy + Math.sqrt(COURT_THREE_R * COURT_THREE_R - Math.pow(hx - COURT_CORNER_X0, 2));

    var threeLine = [[COURT_CORNER_X0, 0], [COURT_CORNER_X0, cornerY]]
      .concat(courtArcPoints(hx, hy, COURT_THREE_R, thetaCornerL, thetaCornerR, 24))
      .concat([[COURT_CORNER_X1, 0]]);
    var raLine = [[hx - COURT_RA_R, 0]].concat(courtArcPoints(hx, hy, COURT_RA_R, 180, 0, 16)).concat([[hx + COURT_RA_R, 0]]);

    [
      [[0, 0], [50, 0]],
      [[COURT_KEY_X0, 0], [COURT_KEY_X0, COURT_KEY_Y1], [COURT_KEY_X1, COURT_KEY_Y1], [COURT_KEY_X1, 0]],
      raLine,
      [[22, 4], [28, 4]]
    ].forEach(function (path) {
      container.appendChild(svgEl("path", { "class": "court-line", d: courtPathFrom(path) }));
    });

    // The one deliberate accent, so the tagger can see at a glance which side of the line a
    // tap falls on.
    container.appendChild(svgEl("path", { "class": "court-line-three", d: courtPathFrom(threeLine) }));

    container.appendChild(svgEl("circle", { "class": "court-line", cx: hx, cy: COURT_KEY_Y1, r: COURT_FT_CIRCLE_R }));
    container.appendChild(svgEl("circle", { "class": "court-line", cx: hx, cy: hy, r: 0.75 }));
  }

  // ---------- Shot location picker interface ----------
  // The zone-tap and freeform-tap variants each define their own openZoneModal(shotEvent,
  // isMade) (called below from handleEventTypeAction), plus the hooks below — the only
  // spots the rest of this file needs to vary by variant. Both are plain function
  // declarations at this same top-level scope, so whichever variant's picker.js is
  // concatenated after this file simply redeclares the ones it needs; the later declaration
  // wins once boot runs (this is ordinary function-hoisting behavior, not a real override
  // mechanism — see build.py). Only the zone variant needs to redeclare shotLocationSummary
  // (a raw shot_x/shot_y pair isn't meaningful in a compact log line); both variants must
  // redeclare applyExportShotLocation and shotPickerVariant, since each exports different
  // fields.
  function shotLocationSummary(ev) { return ""; }

  // Which picker variant this file is. Saved on the match so a match started in one variant is
  // never resumed in the other (each exports only its own location fields, so the other's
  // locations would be silently dropped) — see isStateCompatible.
  function shotPickerVariant() { return ""; }

  // The hosted build serves each variant as its own page (build.py's SITE_PAGES) — zones, the
  // standard picker, is the site's front page.
  var VARIANT_INFO = {
    zone: { labelKey: "variant.zone", url: "./" },
    freeform: { labelKey: "variant.freeform", url: "freeform.html" }
  };

  // ---------- State ----------
  var state = null;

  function loadState() {
    var raw = storageGet(STORAGE_KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  function saveState() {
    storageSet(STORAGE_KEY, JSON.stringify(state));
  }

  function clearState() {
    storageRemove(STORAGE_KEY);
    state = null;
  }

  // Every tagger file opened from local storage (file://) can share one origin, and so one
  // saved match: open a single-team tagger while a full-tagger match is still unfinished (or a
  // tagger generated from an older roster) and the saved match references teams/players this
  // file doesn't know. Resuming it would crash on the first name lookup, so it's checked first.
  function isStateCompatible(s) {
    if (!s || !s.match || !Array.isArray(s.events)) return false;
    // Matches saved before variants were recorded have none — accept those as before.
    if (s.variant && s.variant !== shotPickerVariant()) return false;
    if (!teamsById[s.match.home_team_id] || !teamsById[s.match.away_team_id]) return false;
    var eventsOk = s.events.every(function (ev) {
      return teamsById[ev.team_id] && playersById[ev.player_id] &&
        (!ev.secondary_player_id || playersById[ev.secondary_player_id]);
    });
    if (!eventsOk) return false;
    var allKnown = function (map) {
      return Object.keys(map || {}).every(function (teamId) {
        return (map[teamId] || []).every(function (pid) { return !!playersById[pid]; });
      });
    };
    return allKnown(s.onCourt) && allKnown(s.squad);
  }

  // ---------- Roster editor (hosted build only) ----------
  // For a game with no roster file: teams and players typed in on the phone. Jersey number is
  // required (it's what the tagger sees on court), name optional. Saved like a loaded roster
  // (ROSTER_STORAGE_KEY) but flagged tagger_made, which makes each match started from it
  // export the roster alongside its events (tagger_roster) — the analytics import then matches
  // each team/player to an existing one or creates it. Editing keeps every id, so matches
  // already exported still line up with it. Downloading it lets a second phone tag with the
  // very same ids.
  var rosterScreen = document.getElementById("roster-screen");
  var rosterEditor = document.getElementById("roster-editor");
  var rosterEditorError = document.getElementById("roster-editor-error");
  var rosterDraft = null;
  var ROSTER_EDITOR_BLANK_ROWS = 5;

  // UUID v4. crypto.randomUUID only exists in secure contexts; the hosted site is one, but a
  // plain getRandomValues fallback costs nothing.
  function newId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    var h = Array.prototype.map.call(b, function (x) { return (x + 0x100).toString(16).slice(1); }).join("");
    return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
  }

  function blankPlayerRow() { return { id: newId(), number: "", name: "" }; }

  function blankTeam() {
    var rows = [];
    for (var i = 0; i < ROSTER_EDITOR_BLANK_ROWS; i++) rows.push(blankPlayerRow());
    return { id: newId(), name: "", players: rows };
  }

  function openRosterEditor(editCurrent) {
    if (editCurrent && ROSTER.tagger_made) {
      rosterDraft = {
        teams: ROSTER.teams.map(function (team) {
          return {
            id: team.id,
            name: team.name,
            players: playersForTeam(team.id).slice().sort(byJersey).map(function (p) {
              return { id: p.id, number: String(p.jersey_number), name: p.name || "" };
            }).concat([blankPlayerRow()])
          };
        })
      };
    } else {
      rosterDraft = { teams: [blankTeam(), blankTeam()] };
    }
    rosterEditorError.classList.add("hidden");
    renderRosterEditor();
    showScreen("roster");

  function textInput(value, placeholder, onInput, extraClass) {
    var input = document.createElement("input");
    input.type = "text";
    input.value = value;
    input.placeholder = placeholder;
    if (extraClass) input.className = extraClass;

  // Inputs write straight into rosterDraft; only adding/removing rows re-renders, so typing
  // never loses focus.
  function renderRosterEditor() {
    rosterEditor.innerHTML = "";
    rosterDraft.teams.forEach(function (team, ti) {
      var card = document.createElement("div");
      card.className = "card roster-team-card";

      var nameRow = document.createElement("div");
      nameRow.className = "team-name-row";
      nameRow.appendChild(textInput(team.name, t("rosterEdit.teamName", { n: ti + 1 }), function (v) { team.name = v; }));
      if (rosterDraft.teams.length > 2) {
        var removeTeam = document.createElement("button");
        removeTeam.className = "roster-remove-btn";
        removeTeam.textContent = "✕";
        removeTeam.title = t("rosterEdit.removeTeam");
        removeTeam.addEventListener("click", function () {
          rosterDraft.teams.splice(ti, 1);
          renderRosterEditor();
        });
        nameRow.appendChild(removeTeam);
      }
      card.appendChild(nameRow);

      team.players.forEach(function (row, pi) {
        var line = document.createElement("div");
        line.className = "roster-player-row";
        var num = textInput(row.number, "#", function (v) { row.number = v; }, "num");
        num.inputMode = "numeric";
        num.maxLength = 2;
        line.appendChild(num);
        line.appendChild(textInput(row.name, t("rosterEdit.playerName"), function (v) { row.name = v; }));
        var remove = document.createElement("button");
        remove.className = "roster-remove-btn";
        remove.textContent = "✕";
        remove.title = t("rosterEdit.removePlayer");
        remove.addEventListener("click", function () {
          team.players.splice(pi, 1);
          renderRosterEditor();
        });
        line.appendChild(remove);
        card.appendChild(line);
      });

      var addPlayer = document.createElement("button");
      addPlayer.className = "btn-ghost btn-block";
      addPlayer.textContent = t("rosterEdit.addPlayer");
      addPlayer.addEventListener("click", function () {
        team.players.push(blankPlayerRow());
        renderRosterEditor();
        var inputs = rosterEditor.querySelectorAll(".roster-team-card")[ti].querySelectorAll("input.num");
        inputs[inputs.length - 1].focus();
      });
      card.appendChild(addPlayer);
      rosterEditor.appendChild(card);
    });
  }

  // The draft as a roster, or an error message. Rows with neither number nor name are just
  // unused blanks and are skipped.
  function rosterFromDraft() {
    var teams = [], players = [], seenNames = {};
    for (var ti = 0; ti < rosterDraft.teams.length; ti++) {
      var team = rosterDraft.teams[ti];
      var teamName = team.name.trim();
      if (!teamName) return { error: t("rosterEdit.errTeamName", { n: ti + 1 }) };
      if (seenNames[teamName.toLowerCase()]) return { error: t("rosterEdit.errTeamDup", { team: teamName }) };
      seenNames[teamName.toLowerCase()] = true;
      teams.push({ id: team.id, name: teamName });
      var seenNumbers = {}, count = 0;
      for (var pi = 0; pi < team.players.length; pi++) {
        var row = team.players[pi];
        var numText = row.number.trim(), name = row.name.trim();
        if (!numText && !name) continue;
        if (!numText) return { error: t("rosterEdit.errNoNumber", { name: name, team: teamName }) };
        if (!/^\d{1,2}$/.test(numText)) return { error: t("rosterEdit.errNumber", { n: numText, team: teamName }) };
        var number = parseInt(numText, 10);
        if (seenNumbers[number]) return { error: t("rosterEdit.errNumberDup", { n: number, team: teamName }) };
        seenNumbers[number] = true;
        players.push({ id: row.id, name: name, jersey_number: number, team_id: team.id });
        count += 1;
      }
      if (count === 0) return { error: t("rosterEdit.errNoPlayers", { team: teamName }) };
    }
    return { roster: { teams: teams, players: players, competitions: [], tagger_made: true } };
  }

  // What a match started from a tagger-made roster exports: its two teams and their players,
  // names left out (null) when none was typed.
  function taggerRosterFor(match) {
    var teamIds = [match.home_team_id, match.away_team_id];
    return {
      teams: teamIds.map(function (id) { return { id: id, name: teamsById[id].name }; }),
      players: ROSTER.players.filter(function (p) { return teamIds.indexOf(p.team_id) !== -1; })
        .map(function (p) {
          return { id: p.id, name: p.name || null, jersey_number: p.jersey_number, team_id: p.team_id };
        })
    };
  }

  document.getElementById("roster-create-btn").addEventListener("click", function () { openRosterEditor(false); });
  document.getElementById("roster-edit-btn").addEventListener("click", function () { openRosterEditor(true); });
  document.getElementById("roster-add-team-btn").addEventListener("click", function () {
    rosterDraft.teams.push(blankTeam());
    renderRosterEditor();
  });
  document.getElementById("roster-back-btn").addEventListener("click", function () {
    rosterDraft = null;
    showScreen("setup");
  });
  document.getElementById("roster-save-btn").addEventListener("click", function () {
    var result = rosterFromDraft();
    rosterEditorError.classList.toggle("hidden", !result.error);
    rosterEditorError.textContent = result.error || "";

    storageSet(ROSTER_STORAGE_KEY, JSON.stringify(result.roster));
    applyRoster(result.roster);

  document.getElementById("roster-download-btn").addEventListener("click", function () {
    var slug = ROSTER.teams.map(function (team) { return team.name; }).join("-")
      .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "roster-" + (slug || "tagger") + ".json";
    document.body.appendChild(link);

  function renderTeamPicker(container, teams, selectedId, disabledId, onPick) {
    container.innerHTML = "";
    var row = document.createElement("div");
    row.className = "team-pick-row";
    teams.forEach(function (team) {
      var btn = document.createElement("button");
      btn.textContent = team.name;

    container.appendChild(row);

  // The away team can never be the home team, so rather than let the tagger pick a conflicting
  // pair, whichever team is currently selected as home is shown disabled (not removed) in the
  // away picker — that way the away section always shows the full roster, and it's visually
  // obvious which team is off-limits and why, instead of the picker silently shrinking.
  // Hosted build only — the local tagger files are separate downloads, there's no page to link.
  // Only on the setup screen, i.e. never mid-match; a match started on one page and opened on

  var variantSwitch = document.getElementById("variant-switch");

  function renderLanguageSwitch() {

  function renderSetupScreen() {

    renderRosterCard();

  document.getElementById("start-match-btn").addEventListener("click", function () {
    setupError.classList.add("hidden");

  // ---------- Who's playing today (matchday squad) screen ----------
  // Not every rostered player dresses for every match. Picking the squad up front keeps the
  // starters screen and the Substitutions bench to the players actually there, and the squad
  // is exported so the analytics side can tell a DNP (in the squad, never got on court) from
  // someone who simply wasn't there. Score-only sides are skipped — no people to pick.
  var squadSelection = {};
  var squadActiveTeamId = null;
  var pendingSquad = null;

  var squadTeamTabs = document.getElementById("squad-team-tabs");
  var squadCountLabel = document.getElementById("squad-count-label");
  var squadGrid = document.getElementById("squad-grid");
  var squadError = document.getElementById("squad-error");

  function trackedTeamIds(match) {
    return [match.home_team_id, match.away_team_id].filter(function (id) { return !isScoreOnly[id]; });
  }

  function loadLastSquads() {
    try { return JSON.parse(storageGet(LAST_SQUAD_STORAGE_KEY) || "{}") || {}; } catch (e) { return {}; }
  }

  function enterSquadScreen() {
    var last = loadLastSquads();
    squadSelection = {};
    trackedTeamIds(pendingMatch).forEach(function (teamId) {
      var rosterIds = playersForTeam(teamId).map(function (p) { return p.id; });
      // Last squad used for this team on this device (minus anyone no longer on the roster);
      // everyone the first time.
      var remembered = (last[teamId] || []).filter(function (id) { return rosterIds.indexOf(id) !== -1; });
      squadSelection[teamId] = remembered.length ? remembered : rosterIds;
    });
    squadActiveTeamId = trackedTeamIds(pendingMatch)[0];
    squadError.classList.add("hidden");
    showScreen("squad");
    renderSquadScreen();
  }

  function renderSquadScreen() {
    squadTeamTabs.innerHTML = "";
    trackedTeamIds(pendingMatch).forEach(function (teamId) {
      var btn = document.createElement("button");
      btn.textContent = teamsById[teamId].name;
      btn.classList.add(teamId === pendingMatch.home_team_id ? "team-home" : "team-away");
      if (teamId === squadActiveTeamId) btn.classList.add("active");
      btn.addEventListener("click", function () {
        squadActiveTeamId = teamId;
        renderSquadScreen();
      });
      squadTeamTabs.appendChild(btn);
    });

    var roster = playersForTeam(squadActiveTeamId).slice().sort(byJersey);
    var selected = squadSelection[squadActiveTeamId];
    squadCountLabel.textContent = t("squad.count", { n: selected.length, total: roster.length });
    squadGrid.classList.toggle("team-context-home", squadActiveTeamId === pendingMatch.home_team_id);
    squadGrid.classList.toggle("team-context-away", squadActiveTeamId === pendingMatch.away_team_id);
    squadGrid.innerHTML = "";
    roster.forEach(function (p) {
      var btn = document.createElement("button");
      btn.className = "player-btn";
      if (selected.indexOf(p.id) !== -1) btn.classList.add("selected");
      // One compact line ("#7 Name", like the Substitutions lists) — a tick-list of a whole
      // roster, not tap targets used all game, so it shouldn't take several screens to scroll.
      btn.innerHTML = '<div class="name">' + escapeHtml(subsLabel(p)) + '</div>';
      btn.addEventListener("click", function () {
        var idx = selected.indexOf(p.id);
        if (idx === -1) selected.push(p.id); else selected.splice(idx, 1);
        renderSquadScreen();
      });
      squadGrid.appendChild(btn);
    });
  }

  document.getElementById("squad-all-btn").addEventListener("click", function () {
    squadSelection[squadActiveTeamId] = playersForTeam(squadActiveTeamId).map(function (p) { return p.id; });
    renderSquadScreen();

  document.getElementById("squad-none-btn").addEventListener("click", function () {
    squadSelection[squadActiveTeamId] = [];
    renderSquadScreen();
  });

  document.getElementById("squad-continue-btn").addEventListener("click", function () {
    squadError.classList.add("hidden");

    if (empty) {
      squadActiveTeamId = empty;
      renderSquadScreen();
      squadError.textContent = t("squad.errEmpty", { team: teamsById[empty].name });
      squadError.classList.remove("hidden");
      return;
    }
    var last = loadLastSquads();
    pendingSquad = {};
    trackedTeamIds(pendingMatch).forEach(function (teamId) {
      pendingSquad[teamId] = squadSelection[teamId].slice();
      last[teamId] = squadSelection[teamId].slice();

    enterStartersScreen();

  document.getElementById("squad-back-btn").addEventListener("click", function () {
    showScreen("setup");
