  // ---------- Starting lineups screen ----------
  // Only the 5 players actually on court are offered on the tagging screen, so the tagger
  // doesn't have to hunt through the whole roster for every event. A team's default starting
  // five can be pre-encoded on its roster entry (team.starters, set by whoever maintains
  // roster.json); if it's missing the tagger just picks manually here instead.
  var pendingMatch = null;
  var pendingImportedBy = null;
  var startersSelection = {};
  var startersActiveTeamId = null;

  var startersTeamTabs = document.getElementById("starters-team-tabs");
  var startersCountLabel = document.getElementById("starters-count-label");
  var startersGrid = document.getElementById("starters-grid");
  var startersScoreOnlyNote = document.getElementById("starters-score-only-note");
  var startersError = document.getElementById("starters-error");

  function enterStartersScreen() {
    startersSelection = {};
    [pendingMatch.home_team_id, pendingMatch.away_team_id].forEach(function (teamId) {
      if (isScoreOnly[teamId]) {
        startersSelection[teamId] = [];
        return;
      }
      var team = teamsById[teamId];
      // A default starter who isn't in today's squad just isn't pre-selected.
      var preset = (team.starters || []).filter(function (id) {
        return playersById[id] && playersById[id].team_id === teamId && pendingSquad[teamId].indexOf(id) !== -1;
      });
      startersSelection[teamId] = preset.slice(0, 5);
    });
    startersActiveTeamId = pendingMatch.home_team_id;
    startersError.classList.add("hidden");
    showScreen("starters");
    renderStartersScreen();
  }

  function renderStartersScreen() {
    startersTeamTabs.innerHTML = "";
    [
      { id: pendingMatch.home_team_id, side: "team-home" },
      { id: pendingMatch.away_team_id, side: "team-away" }
    ].forEach(function (entry) {
      var btn = document.createElement("button");
      btn.textContent = teamsById[entry.id].name;
      btn.classList.add(entry.side);
      if (entry.id === startersActiveTeamId) btn.classList.add("active");
      btn.addEventListener("click", function () {
        startersActiveTeamId = entry.id;
        renderStartersScreen();
      });
      startersTeamTabs.appendChild(btn);
    });

    var scoreOnly = isScoreOnly[startersActiveTeamId];
    startersGrid.classList.toggle("hidden", scoreOnly);
    startersCountLabel.classList.toggle("hidden", scoreOnly);
    startersScoreOnlyNote.classList.toggle("hidden", !scoreOnly);
    if (scoreOnly) {
      startersGrid.innerHTML = "";
      return;
    }

    var selected = startersSelection[startersActiveTeamId] || [];
    startersCountLabel.textContent = t("starters.count", { n: selected.length });

    startersGrid.classList.toggle("team-context-home", startersActiveTeamId === pendingMatch.home_team_id);
    startersGrid.classList.toggle("team-context-away", startersActiveTeamId === pendingMatch.away_team_id);
    startersGrid.innerHTML = "";
    playersForTeam(startersActiveTeamId).filter(function (p) {
      return pendingSquad[startersActiveTeamId].indexOf(p.id) !== -1;
    }).forEach(function (p) {
      var btn = document.createElement("button");
      btn.className = "player-btn";
      if (selected.indexOf(p.id) !== -1) btn.classList.add("selected");
      fillPlayerButton(btn, p);
      btn.addEventListener("click", function () { toggleStarter(startersActiveTeamId, p.id); });
      startersGrid.appendChild(btn);
    });
  }

  function toggleStarter(teamId, playerId) {
    var list = startersSelection[teamId] || (startersSelection[teamId] = []);
    var idx = list.indexOf(playerId);
    if (idx !== -1) {
      list.splice(idx, 1);
    } else {
      if (list.length >= 5) return;
      list.push(playerId);
    }
    renderStartersScreen();
  }

  document.getElementById("starters-continue-btn").addEventListener("click", function () {
    var homeIds = startersSelection[pendingMatch.home_team_id] || [];
    var awayIds = startersSelection[pendingMatch.away_team_id] || [];
    startersError.classList.add("hidden");
    // A score-only side has no roster to pick a lineup from, so it's exempt from this check —
    // see isScoreOnly.
    var missingRequired = [pendingMatch.home_team_id, pendingMatch.away_team_id].some(function (teamId) {
      return !isScoreOnly[teamId] && (startersSelection[teamId] || []).length === 0;
    });
    if (missingRequired) {
      startersError.textContent = t("starters.errEmpty");
      startersError.classList.remove("hidden");
      return;
    }

    state = {
      version: 1,
      variant: shotPickerVariant(),
      match: pendingMatch,
      imported_by: pendingImportedBy,
      squad: pendingSquad,
      currentPeriod: 1,
      nextSequence: 1,
      activeTeamId: pendingMatch.home_team_id,
      onCourt: {},
      events: []
    };
    // A roster typed in on this phone has ids the analytics side has never seen, so the match
    // keeps its own copy to export (see buildExportPayload) — editing the roster afterwards
    // can't change what this match refers to.
    if (ROSTER.tagger_made) state.tagger_roster = taggerRosterFor(pendingMatch);
    state.onCourt[pendingMatch.home_team_id] = homeIds.slice();
    state.onCourt[pendingMatch.away_team_id] = awayIds.slice();
    // Logs an 'in' substitution event for every starter right as tagging begins, so the
    // on-court set at any later point is always fully reconstructable from the event log alone
    // (see subOut/subIn) — no separate "starting five" concept needs to survive into
    // match_export.json for plus-minus to work downstream.
    homeIds.forEach(function (pid) {
      commitEvent({ team_id: pendingMatch.home_team_id, player_id: pid, event_type: "substitution", sub_type: "in" });
    });
    awayIds.forEach(function (pid) {
      commitEvent({ team_id: pendingMatch.away_team_id, player_id: pid, event_type: "substitution", sub_type: "in" });
    });
    pendingMatch = null;
    pendingImportedBy = null;
    pendingSquad = null;
    pauseNudge = null; // an unanswered one from the previous match
    saveState();
    enterTaggingScreen();
  });

  document.getElementById("starters-back-btn").addEventListener("click", function () {
    showScreen("squad");
    renderSquadScreen();
  });

  // ---------- Tagging screen ----------
  var periodLabel = document.getElementById("period-label");
  var periodMinusBtn = document.getElementById("period-minus-btn");
  var teamTabs = document.getElementById("team-tabs");
  var playerGrid = document.getElementById("player-grid");
  var scoreOnlyPanel = document.getElementById("score-only-panel");
  var subsBtn = document.getElementById("subs-btn");
  var eventLog = document.getElementById("event-log");
  var scoreHomeName = document.getElementById("score-home-name");
  var scoreAwayName = document.getElementById("score-away-name");
  var scoreHomeValue = document.getElementById("score-home-value");
  var scoreAwayValue = document.getElementById("score-away-value");

  function enterTaggingScreen() {
    showScreen("tagging");
    renderTaggingScreen();
    requestWakeLock();
  }

  // ---------- Keep screen awake ----------
  // A phone locking itself during a timeout costs the tagger the next few plays. Best-effort
  // only: the API is missing on older browsers and may be refused (low battery, file:// on
  // some browsers) — either way tagging just carries on with normal screen timeout.
  var wakeLock = null;

  function requestWakeLock() {
    if (!("wakeLock" in navigator) || wakeLock) return;
    try {
      navigator.wakeLock.request("screen").then(function (lock) {
        wakeLock = lock;
        lock.addEventListener("release", function () { wakeLock = null; });
      }).catch(function () {});
    } catch (e) {}
  }

  function releaseWakeLock() {
    if (!wakeLock) return;
    try { wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }

  // The browser drops the lock whenever the page is hidden (app switch, screen off), so it has
  // to be re-requested on the way back.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && state && !taggingScreen.classList.contains("hidden")) {
      requestWakeLock();
    }
  });

  // Regulation is 4 quarters; anything past that is overtime, labeled OT1, OT2, ... rather
  // than "Period 5", "Period 6" since that's how contributors actually think and talk about it.
  function periodLabelText(period) {
    return period <= 4 ? "Q" + period : "OT" + (period - 4);
  }

  function renderTaggingScreen() {
    periodLabel.textContent = periodLabelText(state.currentPeriod);
    periodMinusBtn.disabled = state.currentPeriod <= 1;
    undoBtn.disabled = !lastUndoableEvent();

    teamTabs.innerHTML = "";
    [
      { id: state.match.home_team_id, side: "team-home" },
      { id: state.match.away_team_id, side: "team-away" }
    ].forEach(function (entry) {
      var btn = document.createElement("button");
      btn.textContent = teamsById[entry.id].name;
      btn.classList.add(entry.side);
      if (entry.id === state.activeTeamId) btn.classList.add("active");
      btn.addEventListener("click", function () {
        state.activeTeamId = entry.id;
        saveState();
        renderTaggingScreen();
      });
      teamTabs.appendChild(btn);
    });

    var scoreOnly = isScoreOnly[state.activeTeamId];
    subsBtn.classList.toggle("hidden", scoreOnly);
    playerGrid.classList.toggle("hidden", scoreOnly);
    scoreOnlyPanel.classList.toggle("hidden", !scoreOnly);

    if (scoreOnly) {
      playerGrid.innerHTML = "";
    } else {
      playerGrid.classList.toggle("team-context-home", state.activeTeamId === state.match.home_team_id);
      playerGrid.classList.toggle("team-context-away", state.activeTeamId === state.match.away_team_id);

      playerGrid.innerHTML = "";
      onCourtPlayers(state.activeTeamId).forEach(function (p) {
        var btn = document.createElement("button");
        btn.className = "player-btn";
        fillPlayerButton(btn, p);
        btn.addEventListener("click", function () { openEventTypeModal(p); });
        playerGrid.appendChild(btn);
      });
    }

    updateScoreboard();
    logBtn.textContent = t("tag.eventLogBtn", { count: state.events.filter(function (ev) {
      return ev.event_type !== "substitution";
    }).length });
    renderPauseNudge();
    renderEventLog();
  }

  // The score-only side has exactly one placeholder player (see
  // analytics-project/roster.py::get_or_create_placeholder) — every tap here commits an
  // ordinary, schema-legal made shot_attempt/free_throw for that one player, with no zone/
  // assist prompt (there's no location or teammate to attribute either to).
  function commitScoreOnlyPoints(points) {
    var teamId = state.activeTeamId;
    var playerId = playersForTeam(teamId)[0].id;
    if (points === 1) {
      commitEvent({ team_id: teamId, player_id: playerId, event_type: "free_throw", outcome: "made", points: 1 });
    } else {
      commitEvent({ team_id: teamId, player_id: playerId, event_type: "shot_attempt", outcome: "made", points: points });
    }
  }

  document.getElementById("score-only-2-btn").addEventListener("click", function () { commitScoreOnlyPoints(2); });
  document.getElementById("score-only-3-btn").addEventListener("click", function () { commitScoreOnlyPoints(3); });
  document.getElementById("score-only-ft-btn").addEventListener("click", function () { commitScoreOnlyPoints(1); });

  function onCourtPlayers(teamId) {
    return (state.onCourt[teamId] || []).map(function (id) { return playersById[id]; });
  }

  document.getElementById("period-plus-btn").addEventListener("click", function () {
    pauseNudge = null;
    state.currentPeriod += 1;
    saveState();
    renderTaggingScreen();
  });

  document.getElementById("period-minus-btn").addEventListener("click", function () {
    pauseNudge = null;
    if (state.currentPeriod > 1) {
      state.currentPeriod -= 1;
      saveState();
      renderTaggingScreen();
    }
  });

  function eventDescription(ev) {
    if (ev.event_type === "shot_attempt") {
      var made = ev.outcome === "made";
      var s = t(made ? "desc.made" : "desc.missed", { points: ev.points });
      s += shotLocationSummary(ev);
      if (made && ev.secondary_player_id) {
        s += t("desc.assist", { name: playerShort(playersById[ev.secondary_player_id]) });
      }
      return s;
    }
    if (ev.event_type === "free_throw") {
      return t(ev.outcome === "made" ? "desc.ftMade" : "desc.ftMissed");
    }
    if (ev.event_type === "rebound") {
      return t(ev.rebound_type === "offensive" ? "desc.offReb" : "desc.defReb");
    }
    if (ev.event_type === "turnover") return t("desc.turnover");
    if (ev.event_type === "steal") return t("desc.steal");
    if (ev.event_type === "foul") {
      var s = t(ev.foul_type ? "foulLog." + ev.foul_type : "desc.foul");
      if (ev.secondary_player_id) s += t("desc.drawnBy", { name: playerShort(playersById[ev.secondary_player_id]) });
      return s;
    }
    if (ev.event_type === "block") {
      var s = t("desc.block");
      if (ev.secondary_player_id) s += t("desc.shotBy", { name: playerShort(playersById[ev.secondary_player_id]) });
      return s;
    }
    return ev.event_type;
  }

  // Score is derived from the event log, not tracked separately, so it can never drift out of
  // sync with it — recomputed here rather than in commitEvent/deleteEvent individually since
  // renderTaggingScreen() is the one function every path that can change it (add, delete, undo)
  // already calls.
  function computeScore(teamId) {
    return state.events.reduce(function (total, ev) {
      if (ev.team_id !== teamId) return total;
      if (ev.event_type === "shot_attempt" && ev.outcome === "made") return total + ev.points;
      if (ev.event_type === "free_throw" && ev.outcome === "made") return total + 1;
      return total;
    }, 0);
  }

  function updateScoreboard() {
    scoreHomeName.textContent = teamsById[state.match.home_team_id].name;
    scoreAwayName.textContent = teamsById[state.match.away_team_id].name;
    scoreHomeValue.textContent = computeScore(state.match.home_team_id);
    scoreAwayValue.textContent = computeScore(state.match.away_team_id);
  }

  function renderEventLog() {
    eventLog.innerHTML = "";
    // Substitutions are logged (see subOut/subIn) so plus-minus can be reconstructed later, but
    // they're bookkeeping, not a "play" — showing all 10 starter check-ins plus every later
    // swap would bury the actual game events. The Substitutions modal is already the place to
    // review/undo who's on court; this log stays focused on what happened in the game.
    var events = state.events
      .filter(function (ev) { return ev.event_type !== "substitution"; })
      .sort(function (a, b) { return b.sequence - a.sequence; });
    if (events.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty-log";
      empty.textContent = t("tag.noEvents");
      eventLog.appendChild(empty);
      return;
    }
    // Gaps are measured against the previous event of any type, substitutions included: the
    // first thing tagged after a quarter break is often a sub.
    var prevAtBySequence = {};
    state.events.slice().sort(function (a, b) { return a.sequence - b.sequence; })
      .forEach(function (ev, i, all) { if (i > 0) prevAtBySequence[ev.sequence] = all[i - 1].at; });
    // A header whenever the period changes, so a forgotten "+" shows up as one long
    // unbroken block, and a pause marker where the real break probably was.
    var lastPeriod = null;
    events.forEach(function (ev) {
      if (ev.period !== lastPeriod) {
        var divider = document.createElement("div");
        divider.className = "log-divider";
        divider.textContent = periodLabelText(ev.period);
        eventLog.appendChild(divider);
        lastPeriod = ev.period;
      }
      var row = document.createElement("div");
      row.className = "log-entry " + (ev.team_id === state.match.home_team_id ? "team-home" : "team-away");
      var player = playersById[ev.player_id];
      var team = teamsById[ev.team_id];
      var info = document.createElement("div");
      info.innerHTML =
        '<div class="desc">' + escapeHtml(playerShort(player) + " — " + eventDescription(ev)) + '</div>';
      var meta = document.createElement("div");
      meta.className = "meta";
      meta.appendChild(document.createTextNode(team.name + " · "));
      // Editable in place, not just deletable — forgetting to advance the period is the most
      // predictable tagging mistake, and re-tapping after a delete would push the corrected
      // event to the end of the sequence instead of fixing it where it happened.
      var periodMinus = document.createElement("button");
      periodMinus.className = "period-btn";
      periodMinus.textContent = "‹";
      periodMinus.title = t("tag.movePrev");
      periodMinus.disabled = ev.period <= 1;
      periodMinus.addEventListener("click", function () { editEventPeriod(ev.sequence, -1); });
      meta.appendChild(periodMinus);
      var periodText = document.createElement("span");
      periodText.textContent = " " + periodLabelText(ev.period) + " ";
      meta.appendChild(periodText);
      var periodPlus = document.createElement("button");
      periodPlus.className = "period-btn";
      periodPlus.textContent = "›";
      periodPlus.title = t("tag.moveNext");
      periodPlus.addEventListener("click", function () { editEventPeriod(ev.sequence, 1); });
      meta.appendChild(periodPlus);
      info.appendChild(meta);
      row.appendChild(info);
      var delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.textContent = "✕";
      delBtn.title = t("tag.delete");
      delBtn.addEventListener("click", function () {
        askConfirm(t("tag.confirmDelete", { desc: playerShort(player) + " — " + eventDescription(ev) }), function () {
          deleteEvent(ev.sequence);
        });
      });
      row.appendChild(delBtn);
      eventLog.appendChild(row);
      var gap = pauseGapMs(prevAtBySequence[ev.sequence], ev.at);
      if (gap !== null) {
        var pause = document.createElement("div");
        pause.className = "log-pause";
        pause.textContent = t("tag.pauseMarker", { time: formatDuration(gap) });
        eventLog.appendChild(pause);
      }
    });
  }

  // ---------- Event log sheet ----------
  // Behind a button rather than under the player grid: during play the log is only needed to
  // fix something, and keeping it off the main screen leaves the tagging controls compact.
  var logModal = document.getElementById("log-modal");
  var logBtn = document.getElementById("log-btn");
  logBtn.addEventListener("click", function () {
    renderEventLog();
    logModal.classList.remove("hidden");
  });
  document.getElementById("log-close-btn").addEventListener("click", function () {
    logModal.classList.add("hidden");
  });

  // ---------- Long-pause nudge ----------
  // Forgetting to press "+" at a quarter break is the most common tagging mistake, and nothing
  // in the log shows it afterwards. Every event records when it was tapped (`at`, see
  // commitEvent), so a long silence followed by a tap in the same period is worth one question.
  // 100 s sits above a timeout (60 s plus the dead time around it) and below a quarter break
  // (2 min) or halftime.
  var LONG_PAUSE_MS = 100 * 1000;
  var pauseNudge = null; // { anchorSeq, fromPeriod, gapMs } — deliberately not saved in state
  var pauseNudgeEl = document.getElementById("pause-nudge");
  var pauseNudgeText = document.getElementById("pause-nudge-text");
  var pauseNudgeYesBtn = document.getElementById("pause-nudge-yes-btn");

  // Matches saved before `at` existed have no timestamps: treat the gap as unknown.
  function pauseGapMs(prevAt, at) {
    if (typeof prevAt !== "number" || typeof at !== "number") return null;
    var gap = at - prevAt;
    return gap >= LONG_PAUSE_MS ? gap : null;
  }

  function formatDuration(ms) {
    var totalSeconds = Math.round(ms / 1000);
    var seconds = totalSeconds % 60;
    return Math.floor(totalSeconds / 60) + ":" + (seconds < 10 ? "0" : "") + seconds;
  }

  function maybeNudgeLongPause(prev, ev) {
    if (!prev || prev.period !== ev.period) return;
    var gap = pauseGapMs(prev.at, ev.at);
    if (gap !== null) pauseNudge = { anchorSeq: ev.sequence, fromPeriod: ev.period, gapMs: gap };
  }

  function renderPauseNudge() {
    pauseNudgeEl.classList.toggle("hidden", !pauseNudge);
    if (!pauseNudge) return;
    var next = periodLabelText(pauseNudge.fromPeriod + 1);
    pauseNudgeText.textContent = t("tag.pauseNudge", { time: formatDuration(pauseNudge.gapMs), period: next });
    pauseNudgeYesBtn.textContent = t("tag.pauseYes", { period: next });
  }

  // Moves everything tagged since the pause (not just the one tap that triggered the question)
  // into the next period, since tagging carries on while the banner is up.
  pauseNudgeYesBtn.addEventListener("click", function () {
    var nudge = pauseNudge;
    pauseNudge = null;
    state.events.forEach(function (ev) {
      if (ev.sequence >= nudge.anchorSeq && ev.period === nudge.fromPeriod) ev.period = nudge.fromPeriod + 1;
    });
    state.currentPeriod = nudge.fromPeriod + 1;
    saveState();
    renderTaggingScreen();
  });

  document.getElementById("pause-nudge-no-btn").addEventListener("click", function () {
    pauseNudge = null;
    renderPauseNudge();
  });

  function deleteEvent(sequence) {
    state.events = state.events.filter(function (e) { return e.sequence !== sequence; });
    saveState();
    renderTaggingScreen();
  }

  // ---------- Undo last ----------
  // The most common live correction is "that last tap was wrong" — one button instead of
  // finding the row in the log. Substitutions are skipped (they're undone from the
  // Substitutions modal, which also fixes the on-court set). Events committed together by one
  // tap (a steal and its linked turnover) share a `group` id in state and are undone together;
  // `group` never reaches the export (buildExportPayload whitelists fields).
  var undoBtn = document.getElementById("undo-btn");

  function lastUndoableEvent() {
    return state.events
      .filter(function (ev) { return ev.event_type !== "substitution"; })
      .sort(function (a, b) { return b.sequence - a.sequence; })[0] || null;
  }

  undoBtn.addEventListener("click", function () {
    var last = lastUndoableEvent();
    if (!last) return;
    var toRemove = state.events.filter(function (ev) {
      return ev.sequence === last.sequence || (last.group !== undefined && ev.group === last.group);
    });
    var text = toRemove
      .sort(function (a, b) { return a.sequence - b.sequence; })
      .map(function (ev) { return playerShort(playersById[ev.player_id]) + " — " + eventDescription(ev); })
      .join(" + ");
    askConfirm(t("tag.confirmUndo", { desc: text }), function () {
      var seqs = toRemove.map(function (ev) { return ev.sequence; });
      state.events = state.events.filter(function (ev) { return seqs.indexOf(ev.sequence) === -1; });
      saveState();
      renderTaggingScreen();
    });
  });

  function editEventPeriod(sequence, delta) {
    var ev = state.events.filter(function (e) { return e.sequence === sequence; })[0];
    if (!ev) return;
    ev.period = Math.max(1, ev.period + delta);
    saveState();
    renderEventLog();
  }

  function commitEvent(partial) {
    var prev = state.events.reduce(function (latest, e) {
      return !latest || e.sequence > latest.sequence ? e : latest;
    }, null);
    var ev = Object.assign({
      sequence: state.nextSequence,
      period: state.currentPeriod,
      at: Date.now()
    }, partial);
    maybeNudgeLongPause(prev, ev);
    state.nextSequence += 1;
    state.events.push(ev);
    saveState();
    renderTaggingScreen();
  }

  // ---------- Event type modal ----------
  var eventTypeModal = document.getElementById("event-type-modal");
  var eventTypeModalTitle = document.getElementById("event-type-modal-title");
  var currentPlayer = null;

  function openEventTypeModal(player) {
    currentPlayer = player;
    eventTypeModalTitle.textContent = t("event.title", { name: playerFull(player) });
    eventTypeModal.classList.remove("hidden");
  }
  function closeEventTypeModal() {
    eventTypeModal.classList.add("hidden");
    currentPlayer = null;
  }
  document.getElementById("event-type-cancel-btn").addEventListener("click", closeEventTypeModal);

  eventTypeModal.querySelectorAll("[data-action]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var action = btn.getAttribute("data-action");
      var player = currentPlayer;
      closeEventTypeModal();
      handleEventTypeAction(action, player);
    });
  });

  function handleEventTypeAction(action, player) {
    var base = { team_id: player.team_id, player_id: player.id };
    switch (action) {
      case "score":
        // points isn't known yet — the zone map (or its 2PT/3PT fallback) determines it.
        openZoneModal(Object.assign({}, base, {
          event_type: "shot_attempt", outcome: "made"
        }), true);
        break;
      case "miss":
        openZoneModal(Object.assign({}, base, {
          event_type: "shot_attempt", outcome: "missed"
        }), false);
        break;
      case "ft_made":
        commitEvent(Object.assign({}, base, {
          event_type: "free_throw", outcome: "made", points: 1
        }));
        break;
      case "ft_missed":
        commitEvent(Object.assign({}, base, {
          event_type: "free_throw", outcome: "missed"
        }));
        break;
      case "off_reb":
        commitEvent(Object.assign({}, base, { event_type: "rebound", rebound_type: "offensive" }));
        break;
      case "def_reb":
        commitEvent(Object.assign({}, base, { event_type: "rebound", rebound_type: "defensive" }));
        break;
      case "turnover":
        commitEvent(Object.assign({}, base, { event_type: "turnover" }));
        break;
      case "steal":
        // A score-only opponent has no roster to attribute the linked turnover to (see
        // isScoreOnly) — skip the link modal entirely and log just the steal, exactly what
        // its own "Skip" option would do, rather than showing an empty player list.
        if (isScoreOnly[otherTeamId(player.team_id)]) {
          commitEvent(Object.assign({}, base, { event_type: "steal" }));
          break;
        }
        openLinkModal(
          t("link.stealTitle", { team: teamsById[otherTeamId(player.team_id)].name }),
          t("link.stealSkip"),
          otherTeamId(player.team_id),
          function (turnoverPlayerId) {
            // One tap, two events — grouped so Undo last removes both (see lastUndoableEvent).
            var group = state.nextSequence;
            commitEvent(Object.assign({}, base, { event_type: "steal", group: group }));
            commitEvent({ team_id: otherTeamId(player.team_id), player_id: turnoverPlayerId, event_type: "turnover", group: group });
          },
          function () {
            commitEvent(Object.assign({}, base, { event_type: "steal" }));
          }
        );
        break;
      case "foul":
        openFoulModal(player, base);
        break;
      case "sub":
        openSubsModal(player.team_id, player.id, true);
        break;
      case "block":
        if (isScoreOnly[otherTeamId(player.team_id)]) {
          commitEvent(Object.assign({}, base, { event_type: "block" }));
          break;
        }
        openLinkModal(
          t("link.blockTitle", { team: teamsById[otherTeamId(player.team_id)].name }),
          t("link.skip"),
          otherTeamId(player.team_id),
          function (shooterId) {
            commitEvent(Object.assign({}, base, { event_type: "block", secondary_player_id: shooterId }));
          },
          function () {
            commitEvent(Object.assign({}, base, { event_type: "block" }));
          }
        );
        break;
    }
  }

  // ---------- Assist modal ----------
  var assistModal = document.getElementById("assist-modal");
  var assistList = document.getElementById("assist-list");
  var pendingShotEvent = null;

  function openAssistModal(shotEvent) {
    pendingShotEvent = shotEvent;
    assistList.innerHTML = "";
    var teammates = onCourtPlayers(shotEvent.team_id).filter(function (p) { return p.id !== shotEvent.player_id; });
    teammates.forEach(function (p) {
      var btn = document.createElement("button");
      btn.textContent = playerFull(p);
      btn.addEventListener("click", function () {
        finishAssist(p.id);
      });
      assistList.appendChild(btn);
    });
    assistModal.classList.remove("hidden");
  }

  function finishAssist(secondaryPlayerId) {
    var ev = pendingShotEvent;
    if (secondaryPlayerId) ev.secondary_player_id = secondaryPlayerId;
    pendingShotEvent = null;
    assistModal.classList.add("hidden");
    commitEvent(ev);
  }

  document.getElementById("no-assist-btn").addEventListener("click", function () {
    finishAssist(null);
  });

  document.getElementById("assist-cancel-btn").addEventListener("click", function () {
    // Unlike "No assist" (which still commits the shot), this discards the whole in-progress
    // shot attempt — for when the location/make-or-miss tap itself was the mistake, not just
    // the assist attribution.
    pendingShotEvent = null;
    assistModal.classList.add("hidden");
  });

  // ---------- Linked attribution modal (steal->turnover, foul->drawn-by, block->whose-shot) ----------
  // Shared by three flows that all follow the same shape: tapping a player logs a primary
  // event for them, and optionally attributes a second role in the same play to a player on
  // the OTHER team — who lost the ball on a steal, who drew a foul, whose shot got blocked.
  // "Skip" still logs the primary event with no attribution; "Cancel" logs nothing at all and
  // returns to the tagging screen, for when the whole tap was a mistake.
  var linkModal = document.getElementById("link-modal");
  var linkModalTitle = document.getElementById("link-modal-title");
  var linkList = document.getElementById("link-list");
  var linkSkipBtn = document.getElementById("link-skip-btn");
  var pendingLinkOnSkip = null;

  function otherTeamId(teamId) {
    return teamId === state.match.home_team_id ? state.match.away_team_id : state.match.home_team_id;
  }

  function openLinkModal(title, skipLabel, teamId, onPick, onSkip) {
    foulTypeRow.classList.add("hidden");
    linkList.classList.remove("hidden");
    linkModalTitle.textContent = title;
    linkSkipBtn.textContent = skipLabel;
    linkList.innerHTML = "";
    onCourtPlayers(teamId).forEach(function (p) {
      var btn = document.createElement("button");
      btn.textContent = playerFull(p);
      btn.addEventListener("click", function () {
        closeLinkModal();
        onPick(p.id);
      });
      linkList.appendChild(btn);
    });
    pendingLinkOnSkip = onSkip;
    linkModal.classList.remove("hidden");
  }

  function closeLinkModal() {
    linkModal.classList.add("hidden");
    pendingLinkOnSkip = null;
  }

  linkSkipBtn.addEventListener("click", function () {
    var onSkip = pendingLinkOnSkip;
    closeLinkModal();
    if (onSkip) onSkip();
  });

  document.getElementById("link-cancel-btn").addEventListener("click", function () {
    closeLinkModal();
  });

  // ---------- Foul: type + who drew it ----------
  // The link modal with a row of foul types on top. Personal is preselected, so the common
  // foul costs no extra tap; the type is exported as foul_type. A technical has nobody who
  // "drew" it, so the player list is hidden for it and Skip becomes the only way to log.
  // An offensive foul is also a turnover by the same player (standard box-score convention),
  // logged as a second, linked event — grouped like a steal's turnover, so Undo removes both.
  // Labels are "foul.<id>" (the button) and "foulLog.<id>" (the event log) in i18n.js.
  var FOUL_TYPES = ["personal", "shooting", "offensive", "technical", "unsportsmanlike", "disqualifying"];
  var foulTypeRow = document.getElementById("foul-type-row");

  function openFoulModal(player, base) {
    var foulType = "personal";
    var opponentId = otherTeamId(player.team_id);
    // A score-only opponent has no roster to name who drew it (see isScoreOnly).
    var canLink = !isScoreOnly[opponentId];
    function commitFoul(drawnByPlayerId) {
      var ev = Object.assign({}, base, { event_type: "foul", foul_type: foulType });
      if (drawnByPlayerId) ev.secondary_player_id = drawnByPlayerId;
      if (foulType !== "offensive") {
        commitEvent(ev);
        return;
      }
      var group = state.nextSequence;
      commitEvent(Object.assign(ev, { group: group }));
      commitEvent(Object.assign({}, base, { event_type: "turnover", group: group }));
    }
    // Title and Skip label depend on the chosen type — render() below sets them.
    openLinkModal(
      "",
      "",
      canLink ? opponentId : null,
      commitFoul,
      function () { commitFoul(null); }
    );
    function render() {
      var linkable = canLink && foulType !== "technical";
      foulTypeRow.innerHTML = "";
      FOUL_TYPES.forEach(function (id) {
        var btn = document.createElement("button");
        btn.textContent = t("foul." + id);
        if (id === foulType) btn.classList.add("selected");
        btn.addEventListener("click", function () { foulType = id; render(); });
        foulTypeRow.appendChild(btn);
      });
      linkList.classList.toggle("hidden", !linkable);
      linkModalTitle.textContent = linkable
        ? t("link.foulTitle", { team: teamsById[opponentId].name })
        : t("foul.titleNoLink", { type: t("foulLog." + foulType), name: playerShort(player) });
      linkSkipBtn.textContent = linkable ? t("link.skip") : t("foul.log", { type: t("foulLog." + foulType).toLowerCase() });
    }
    render();
    foulTypeRow.classList.remove("hidden");
  }

  // ---------- Substitutions modal ----------
  // A swap is two taps: who comes off, then who goes on — logged as an out followed by an in.
  // Both tracked teams are reachable from tabs inside the modal, so a dead ball with subs on
  // both sides is one visit. Opened from a player's own event picker ("⇄ Sub") that player is
  // already selected and the modal closes after the swap: tap player, Sub, pick the replacement.
  var subsModal = document.getElementById("subs-modal");
  var subsTeamTabs = document.getElementById("subs-team-tabs");
  var subsOnCourtTitle = document.getElementById("subs-oncourt-title");
  var subsOnCourtList = document.getElementById("subs-oncourt-list");
  var subsBenchList = document.getElementById("subs-bench-list");
  var subsOutOnlyBtn = document.getElementById("subs-out-only-btn");
  var subsExtraToggle = document.getElementById("subs-extra-toggle");
  var subsExtraList = document.getElementById("subs-extra-list");
  var subsExtraOpen = false;
  var subsTeamId = null;
  var subsSelectedOut = null;
  var subsCloseAfterSwap = false;

  function openSubsModal(teamId, selectedOutId, closeAfterSwap) {
    subsTeamId = teamId;
    subsSelectedOut = selectedOutId;
    subsCloseAfterSwap = closeAfterSwap;
    subsExtraOpen = false;
    renderSubsModal();
    subsModal.classList.remove("hidden");
  }

  function closeSubsModal() {
    subsModal.classList.add("hidden");
    renderTaggingScreen();
  }

  document.getElementById("subs-btn").addEventListener("click", function () {
    openSubsModal(state.activeTeamId, null, false);
  });

  // Today's squad for a team (see the "Who's playing today" screen), or null for a match
  // started before squads existed — the bench is then the whole roster, as it always was.
  function squadIds(teamId) {
    return state.squad && state.squad[teamId] ? state.squad[teamId] : null;
  }

  subsExtraToggle.addEventListener("click", function () {
    subsExtraOpen = !subsExtraOpen;
    renderSubsModal();
  });

  // Adding someone to the squad mid-match (a late arrival, or left out by mistake) puts them
  // on the bench, ready to sub in, and into the exported squad.
  function addToSquad(teamId, playerId) {
    if (state.squad[teamId].indexOf(playerId) === -1) state.squad[teamId].push(playerId);
    subsExtraOpen = false;
    saveState();
    renderSubsModal();
  }

  var subsBenchTitle = document.getElementById("subs-bench-title");

  // Jersey number first — it's what the tagger reads off the court — and no "#null" for a
  // player the roster has no number for.
  function subsLabel(p) {
    return [jerseyText(p), p.name].filter(Boolean).join(" ");
  }

  // Sorted by jersey number (unnumbered last, then by name), so a long bench can be scanned
  // for a number instead of read top to bottom.
  function byJersey(a, b) {
    var ja = a.jersey_number === null || a.jersey_number === undefined ? Infinity : a.jersey_number;
    var jb = b.jersey_number === null || b.jersey_number === undefined ? Infinity : b.jersey_number;
    return ja !== jb ? ja - jb : String(a.name).localeCompare(String(b.name));
  }

  function renderSubsTeamTabs() {
    subsTeamTabs.innerHTML = "";
    var tracked = trackedTeamIds(state.match);
    subsTeamTabs.classList.toggle("hidden", tracked.length < 2);
    tracked.forEach(function (teamId) {
      var btn = document.createElement("button");
      btn.textContent = teamsById[teamId].name;
      btn.classList.add(teamId === state.match.home_team_id ? "team-home" : "team-away");
      if (teamId === subsTeamId) btn.classList.add("active");
      btn.addEventListener("click", function () {
        if (teamId === subsTeamId) return;
        subsTeamId = teamId;
        subsSelectedOut = null;
        subsExtraOpen = false;
        renderSubsModal();
      });
      subsTeamTabs.appendChild(btn);
    });
  }

  function renderSubsModal() {
    var teamId = subsTeamId;
    var onCourtIds = state.onCourt[teamId] || [];
    if (subsSelectedOut && onCourtIds.indexOf(subsSelectedOut) === -1) subsSelectedOut = null;
    var squad = squadIds(teamId);
    var bench = playersForTeam(teamId)
      .filter(function (p) { return onCourtIds.indexOf(p.id) === -1 && (!squad || squad.indexOf(p.id) !== -1); })
      .sort(byJersey);
    var courtFull = onCourtIds.length >= 5;
    // A bench tap swaps with the selected player, or — with a free spot on court and nobody
    // selected — just sends the player on.
    var benchTappable = !!subsSelectedOut || !courtFull;
    var sideClass = teamId === state.match.home_team_id ? "team-context-home" : "team-context-away";

    renderSubsTeamTabs();
    subsOnCourtTitle.textContent = t(subsSelectedOut ? "subs.onCourtDeselect" : "subs.onCourtPick");
    subsBenchTitle.textContent = subsSelectedOut
      ? t("subs.benchReplace", { name: playerShort(playersById[subsSelectedOut]) })
      : t(courtFull ? "subs.benchPickFirst" : "subs.benchSendOn");

    subsOnCourtList.innerHTML = "";
    subsOnCourtList.classList.remove("team-context-home", "team-context-away");
    subsOnCourtList.classList.add(sideClass);
    if (onCourtIds.length === 0) {
      var emptyOnCourt = document.createElement("div");
      emptyOnCourt.className = "empty-log";
      emptyOnCourt.textContent = t("subs.noneOnCourt");
      subsOnCourtList.appendChild(emptyOnCourt);
    }
    onCourtPlayers(teamId).slice().sort(byJersey).forEach(function (p) {
      var btn = document.createElement("button");
      btn.textContent = subsLabel(p);
      if (p.id === subsSelectedOut) btn.classList.add("selected");
      btn.addEventListener("click", function () {
        subsSelectedOut = subsSelectedOut === p.id ? null : p.id;
        renderSubsModal();
      });
      subsOnCourtList.appendChild(btn);
    });

    subsBenchList.innerHTML = "";
    if (bench.length === 0) {
      var emptyBench = document.createElement("div");
      emptyBench.className = "empty-log";
      emptyBench.textContent = t(squadIds(teamId) ? "subs.squadAllOn" : "subs.rosterAllOn");
      subsBenchList.appendChild(emptyBench);
    }
    bench.forEach(function (p) {
      var btn = document.createElement("button");
      btn.textContent = subsLabel(p);
      btn.disabled = !benchTappable;
      btn.addEventListener("click", function () {
        if (subsSelectedOut) swap(teamId, subsSelectedOut, p.id);
        else subIn(teamId, p.id);
      });
      subsBenchList.appendChild(btn);
    });

    subsOutOnlyBtn.classList.toggle("hidden", !subsSelectedOut);
    if (subsSelectedOut) {
      subsOutOnlyBtn.textContent = t("subs.outOnly", { name: playerShort(playersById[subsSelectedOut]) });
    }

    var notInSquad = squad
      ? playersForTeam(teamId).filter(function (p) { return squad.indexOf(p.id) === -1; }).sort(byJersey)
      : [];
    subsExtraToggle.classList.toggle("hidden", notInSquad.length === 0);
    subsExtraToggle.textContent = t(subsExtraOpen ? "subs.hideExtra" : "subs.addExtra");
    subsExtraList.classList.toggle("hidden", !subsExtraOpen || notInSquad.length === 0);
    subsExtraList.innerHTML = "";
    notInSquad.forEach(function (p) {
      var btn = document.createElement("button");
      btn.textContent = "+ " + subsLabel(p);
      btn.addEventListener("click", function () { addToSquad(teamId, p.id); });
      subsExtraList.appendChild(btn);
    });
  }

  subsOutOnlyBtn.addEventListener("click", function () {
    if (!subsSelectedOut) return;
    var playerId = subsSelectedOut;
    subsSelectedOut = null;
    subOut(subsTeamId, playerId);
  });

  // Logged as 'substitution' events (sub_type 'in'/'out'), not just a change to local
  // state.onCourt — this is what lets the analytics side reconstruct who was on court at any
  // point in the match (for plus-minus) purely from the exported event log, with no separate
  // "lineup" concept needed. commitEvent() already calls saveState() after appending the event,
  // so the onCourt mutation above it rides along in that same save rather than needing its own.
  function subOut(teamId, playerId) {
    state.onCourt[teamId] = (state.onCourt[teamId] || []).filter(function (id) { return id !== playerId; });
    commitEvent({ team_id: teamId, player_id: playerId, event_type: "substitution", sub_type: "out" });
    renderSubsModal();
  }

  function subIn(teamId, playerId) {
    var list = state.onCourt[teamId] || (state.onCourt[teamId] = []);
    if (list.length >= 5 || list.indexOf(playerId) !== -1) return;
    list.push(playerId);
    commitEvent({ team_id: teamId, player_id: playerId, event_type: "substitution", sub_type: "in" });
    renderSubsModal();
  }

  // The replacement takes the same spot in the on-court order, so the main player grid
  // doesn't reshuffle under the tagger's thumb after every sub.
  function swap(teamId, outId, inId) {
    var slot = (state.onCourt[teamId] || []).indexOf(outId);
    subsSelectedOut = null;
    subOut(teamId, outId);
    subIn(teamId, inId);
    var list = state.onCourt[teamId];
    if (slot !== -1 && list[list.length - 1] === inId) {
      list.splice(list.length - 1, 1);
      list.splice(slot, 0, inId);
      saveState();
    }
    if (subsCloseAfterSwap) closeSubsModal();
    else renderSubsModal();
  }

  document.getElementById("subs-done-btn").addEventListener("click", closeSubsModal);

  // ---------- Finish & export ----------
  var confirmModal = document.getElementById("confirm-modal");
  var confirmModalText = document.getElementById("confirm-modal-text");
  var confirmYesBtn = document.getElementById("confirm-yes-btn");
  var confirmNoBtn = document.getElementById("confirm-no-btn");

  function askConfirm(text, onYes, onNo) {
    confirmModalText.textContent = text;
    confirmModal.classList.remove("hidden");
    function cleanup() {
      confirmModal.classList.add("hidden");
      confirmYesBtn.removeEventListener("click", yesHandler);
      confirmNoBtn.removeEventListener("click", noHandler);
    }
    function yesHandler() { cleanup(); onYes(); }
    function noHandler() { cleanup(); if (onNo) onNo(); }
    confirmYesBtn.addEventListener("click", yesHandler);
    confirmNoBtn.addEventListener("click", noHandler);
  }

  document.getElementById("finish-btn").addEventListener("click", function () {
    askConfirm(t("finish.confirm"), function () {
      openExportModal();
    });
  });

  // Whitelists fields, so state-only bookkeeping (`group`, the `at` tap time) never reaches the
  // export.
  function buildExportPayload() {
    var events = state.events.slice().sort(function (a, b) { return a.sequence - b.sequence; })
      .map(function (ev) {
        var out = {
          sequence: ev.sequence,
          period: ev.period,
          team_id: ev.team_id,
          player_id: ev.player_id,
          event_type: ev.event_type
        };
        if (ev.event_type === "shot_attempt") {
          out.outcome = ev.outcome;
          out.points = ev.points;
          if (ev.outcome === "made" && ev.secondary_player_id) {
            out.secondary_player_id = ev.secondary_player_id;
          }
          applyExportShotLocation(ev, out);
        } else if (ev.event_type === "free_throw") {
          out.outcome = ev.outcome;
          if (ev.outcome === "made") out.points = ev.points;
        } else if (ev.event_type === "rebound") {
          out.rebound_type = ev.rebound_type;
        } else if (ev.event_type === "foul" || ev.event_type === "block") {
          if (ev.secondary_player_id) out.secondary_player_id = ev.secondary_player_id;
          // Fouls logged before foul types existed have none — exported without, as before.
          if (ev.event_type === "foul" && ev.foul_type) out.foul_type = ev.foul_type;
        } else if (ev.event_type === "substitution") {
          out.sub_type = ev.sub_type;
        }
        return out;
      });

    var payload = {
      match: state.match,
      imported_by: state.imported_by,
      exported_at: new Date().toISOString(),
      events: events
    };
    if (state.tagger_roster) payload.tagger_roster = state.tagger_roster;
    // Matchday squads, so the analytics side can record DNPs — only for tracked teams, and not
    // at all for a match started before squads existed (the importer treats it as optional).
    if (state.squad) {
      payload.squads = Object.keys(state.squad).map(function (teamId) {
        return { team_id: teamId, player_ids: state.squad[teamId].slice() };
      });
    }
    return payload;
  }

  // ---------- Export modal ----------
  // Explicit Download/Share controls, rather than an auto-triggered export: on several
  // browsers (notably desktop Chrome and locked-down mobile contexts) navigator.share()
  // can silently reject even when canShare() returned true, and older iOS Safari doesn't
  // reliably honor the <a download> attribute either. A visible, always-present link the
  // user taps themselves is the only thing that's reliably retryable when that happens.
  //
  // navigator.share() is only even attempted when the page is served over http(s). This
  // file is always opened directly (file://, or a content:// URI from a chat app's file
  // viewer) — Chromium's Web Share implementation unconditionally rejects with
  // NotAllowedError for those origins, on desktop AND Android, no matter what canShare()
  // claims beforehand or how well the rejection is caught. Offering a button that can
  // never work is worse than not offering it, so it's simply not shown in that case.
  var isWebOrigin = location.protocol === "http:" || location.protocol === "https:";

  var exportModal = document.getElementById("export-modal");
  var exportModalDesc = document.getElementById("export-modal-desc");
  var exportDownloadLink = document.getElementById("export-download-link");
  var exportShareBtn = document.getElementById("export-share-btn");
  var exportShareStatus = document.getElementById("export-share-status");
  var exportDoneBtn = document.getElementById("export-done-btn");
  var exportKeepBtn = document.getElementById("export-keep-btn");
  var currentExportUrl = null;
  var currentExportBlob = null;
  var currentExportFilename = null;
  var currentShareFilename = null;

  function setShareStatus(text) {
    if (!text) {
      exportShareStatus.classList.add("hidden");
      exportShareStatus.textContent = "";
      return;
    }
    exportShareStatus.textContent = text;
    exportShareStatus.classList.remove("hidden");
  }

  function openExportModal() {
    var payload = buildExportPayload();
    currentExportFilename = "match_export_" + state.match.played_on + "_" + Date.now() + ".json";
    // Shared files go out as .txt (same JSON content — the Import page accepts both): Chrome on
    // Android only lets a web page share files whose *extension* is on its own allowlist, and
    // .json isn't on it. share() then rejects with NotAllowedError, even though canShare()
    // said yes beforehand, since canShare() doesn't check the extension.
    currentShareFilename = currentExportFilename.replace(/\.json$/, ".txt");
    var json = JSON.stringify(payload, null, 2);
    currentExportBlob = new Blob([json], { type: "application/json" });
    currentExportUrl = URL.createObjectURL(currentExportBlob);

    exportDownloadLink.href = currentExportUrl;
    exportDownloadLink.download = currentExportFilename;
    setShareStatus(null);

    var canShareFiles = false;
    if (isWebOrigin && navigator.canShare && navigator.share) {
      try {
        // iOS Safari's canShare()/share() reject files whose MIME type isn't on its
        // internal allowlist — "application/json" is not on it, so probing with the
        // real content type makes canShare() return false and the button never appears,
        // even though sharing a JSON file works fine once it's tagged as "text/plain".
        var probeFile = new File([currentExportBlob], currentShareFilename, { type: "text/plain" });
        canShareFiles = navigator.canShare({ files: [probeFile] });
      } catch (e) { canShareFiles = false; }
    }
    exportShareBtn.classList.toggle("hidden", !canShareFiles);
    exportModalDesc.textContent = canShareFiles
      ? t("export.descShare")
      : t("export.descDownload");

    exportModal.classList.remove("hidden");
  }

  function closeExportModal() {
    exportModal.classList.add("hidden");
    if (currentExportUrl) {
      URL.revokeObjectURL(currentExportUrl);
      currentExportUrl = null;
    }
  }

  exportShareBtn.addEventListener("click", function () {
    // Feedback here must not rely on alert(): some in-app browsers (chat apps'
    // built-in viewers, etc.) silently no-op window.alert(), which would make a
    // real failure look identical to nothing happening at all. Writing directly
    // into the page is the only reliably visible channel in those contexts.
    // Set immediately (before the async call) so a tap always visibly registers,
    // even if the OS share sheet takes a moment (or never) to appear.
    setShareStatus(t("export.opening"));
    try {
      var file = new File([currentExportBlob], currentShareFilename, { type: "text/plain" });
      navigator.share({ files: [file], title: currentShareFilename })
        .then(function () { setShareStatus(null); })
        .catch(function (err) {
          // Do not special-case AbortError as "user cancelled, stay quiet": on Android,
          // share() can reject with AbortError even when no share sheet ever appeared
          // (i.e. it also covers "the share failed"), not only an intentional dismissal.
          // Silently swallowing it here previously looked exactly like a dead button.
          var reason = err && err.name ? err.name : "unknown error";
          setShareStatus(t("export.shareFailed", { reason: reason }));
        });
    } catch (e) {
      setShareStatus(t("export.shareUnavailable"));
    }
  });

  exportDoneBtn.addEventListener("click", function () {
    closeExportModal();
    clearState();
    releaseWakeLock();
    recoveringForeignMatch = false;
    showScreen("setup");
    resetSetupSelection();
    taggerNameInput.value = "";
    competitionSelect.value = "";
    renderSetupScreen();
  });

  exportKeepBtn.addEventListener("click", function () {
    closeExportModal();
    if (recoveringForeignMatch) recoveryModal.classList.remove("hidden");
  });

  // ---------- Recovery: saved match from a different tagger file ----------
  // See isStateCompatible. The foreign match is still perfectly exportable — buildExportPayload
  // and openExportModal only read ids and raw event fields, never names — so it goes through
  // the normal export modal (whose "clear this match" then frees this file for a new match)
  // rather than being silently lost or crashing the page.
  var recoveryModal = document.getElementById("recovery-modal");
  var recoverySwitchLink = document.getElementById("recovery-switch-link");
  var recoveringForeignMatch = false;

  function openRecoveryModal() {
    recoveringForeignMatch = true;
    // Hosted build: if the only problem is that the match was started on the other variant's
    // page (same site, same roster), the fix is simply to go back there.
    var otherVariant = state.variant && VARIANT_INFO[state.variant];
    var onlyVariantDiffers = IS_HOSTED && otherVariant &&
      isStateCompatible(Object.assign({}, state, { variant: undefined }));
    recoverySwitchLink.classList.toggle("hidden", !onlyVariantDiffers);
    if (onlyVariantDiffers) {
      recoverySwitchLink.href = otherVariant.url;
      recoverySwitchLink.textContent = t("recovery.continue", { variant: t(otherVariant.labelKey) });
    }
    showScreen("setup");
    renderSetupScreen();
    recoveryModal.classList.remove("hidden");
  }

  document.getElementById("recovery-export-btn").addEventListener("click", function () {
    recoveryModal.classList.add("hidden");
    openExportModal();
  });

  document.getElementById("recovery-discard-btn").addEventListener("click", function () {
    recoveryModal.classList.add("hidden");
    askConfirm(t("recovery.confirmDiscard"), function () {
      clearState();
      recoveringForeignMatch = false;
      renderSetupScreen();
    }, function () {
      recoveryModal.classList.remove("hidden");
    });
  });

  // ---------- Stats overlay (client-side box score, print-to-PDF) ----------
  // Same formulas analytics-project/analytics.py's _PRIMARY_STATS_CTE/_ASSIST_STATS_CTE use to
  // compute a match box score from the event table, transliterated to run over the in-memory
  // event log instead of SQL — so a coach can see (and print) a box score the moment tagging
  // ends, without importing into the analytics app first. A score-only team (see isScoreOnly)
  // needs no special-casing here: since no rebound/foul/assist/etc. events are ever committed
  // for it, its one placeholder player's row naturally comes out with only points/fga/fgm/fta/
  // ftm populated, matching what the backend would compute from the same events post-import.
  // Column headers are "stats.<key>" in i18n.js.
  // Counting columns are summed for the totals row; a column with pct() is a ratio, computed
  // from the row's own counts (so the totals row gets the team's real percentage, not a sum),
  // with the same formulas as the analytics project (3_Stats.py: TS% = PTS / 2(FGA + 0.44 FTA),
  // eFG% = (FGM + 0.5 3PM) / FGA). "—" when there's no attempt to divide by.
  var BOX_SCORE_COLUMNS = [
    { key: "points" },
    { key: "fgm" },
    { key: "fga" },
    { key: "fg_pct", pct: function (r) { return [r.fgm, r.fga]; } },
    { key: "fg3m" },
    { key: "fg3a" },
    { key: "fg3_pct", pct: function (r) { return [r.fg3m, r.fg3a]; } },
    { key: "ftm" },
    { key: "fta" },
    { key: "ft_pct", pct: function (r) { return [r.ftm, r.fta]; } },
    { key: "reb_off" },
    { key: "reb_def" },
    { key: "assists" },
    { key: "steals" },
    { key: "turnovers" },
    { key: "fouls" },
    { key: "blocks" },
    { key: "efg_pct", pct: function (r) { return [r.fgm + 0.5 * r.fg3m, r.fga]; } },
    { key: "ts_pct", pct: function (r) { return [r.points, 2 * (r.fga + 0.44 * r.fta)]; } }
  ];

  function boxScoreCell(col, row) {
    if (!col.pct) return String(row[col.key]);
    var nd = col.pct(row);
    return nd[1] > 0 ? Math.round(100 * nd[0] / nd[1]) + "%" : "—";
  }

  function computePlayerStats(playerId) {
    var s = {
      points: 0, fga: 0, fgm: 0, fg3a: 0, fg3m: 0, fta: 0, ftm: 0,
      reb_off: 0, reb_def: 0, assists: 0, steals: 0, turnovers: 0, fouls: 0, blocks: 0
    };
    state.events.forEach(function (ev) {
      if (ev.player_id === playerId) {
        if (ev.event_type === "shot_attempt") {
          s.fga++;
          if (ev.points === 3) s.fg3a++;
          if (ev.outcome === "made") {
            s.fgm++;
            s.points += ev.points;
            if (ev.points === 3) s.fg3m++;
          }
        } else if (ev.event_type === "free_throw") {
          s.fta++;
          if (ev.outcome === "made") {
            s.ftm++;
            s.points += 1;
          }
        } else if (ev.event_type === "rebound") {
          s[ev.rebound_type === "offensive" ? "reb_off" : "reb_def"]++;
        } else if (ev.event_type === "steal") {
          s.steals++;
        } else if (ev.event_type === "turnover") {
          s.turnovers++;
        } else if (ev.event_type === "foul") {
          s.fouls++;
        } else if (ev.event_type === "block") {
          s.blocks++;
        }
      }
      if (ev.event_type === "shot_attempt" && ev.outcome === "made" && ev.secondary_player_id === playerId) {
        s.assists++;
      }
    });
    return s;
  }

  // Row set matches match_box_score's SQL exactly: only players who actually appear in an
  // event or as an assist for this team, not the whole roster (someone who never left the
  // bench shouldn't get a zeroed-out row), plus a summed "TEAM TOTALS" row.
  function computeTeamBoxScore(teamId) {
    var ids = {};
    state.events.forEach(function (ev) {
      if (ev.team_id !== teamId) return;
      ids[ev.player_id] = true;
      if (ev.event_type === "shot_attempt" && ev.outcome === "made" && ev.secondary_player_id) {
        ids[ev.secondary_player_id] = true;
      }
    });
    var rows = Object.keys(ids).map(function (pid) {
      var stats = computePlayerStats(pid);
      stats.player_id = pid;
      stats.name = subsLabel(playersById[pid]);
      return stats;
    }).sort(function (a, b) { return b.points - a.points; });

    var totals = { name: t("stats.totals") };
    BOX_SCORE_COLUMNS.forEach(function (col) {
      if (col.pct) return;
      totals[col.key] = rows.reduce(function (sum, r) { return sum + r[col.key]; }, 0);
    });
    return { rows: rows, totals: totals };
  }

  function buildBoxScoreTable(teamName, boxScore) {
    var table = document.createElement("table");
    table.className = "stats-table";
    var caption = document.createElement("caption");
    caption.textContent = teamName;
    table.appendChild(caption);

    var thead = document.createElement("thead");
    var headRow = document.createElement("tr");
    var nameTh = document.createElement("th");
    nameTh.textContent = t("stats.player");
    headRow.appendChild(nameTh);
    BOX_SCORE_COLUMNS.forEach(function (col) {
      var th = document.createElement("th");
      th.textContent = t("stats." + col.key);
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    function addRow(rowData, isTotals) {
      var tr = document.createElement("tr");
      if (isTotals) tr.className = "totals-row";
      var nameTd = document.createElement("td");
      nameTd.textContent = rowData.name;
      tr.appendChild(nameTd);
      BOX_SCORE_COLUMNS.forEach(function (col) {
        var td = document.createElement("td");
        td.textContent = boxScoreCell(col, rowData);
        if (col.pct) td.className = "pct";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    }
    boxScore.rows.forEach(function (r) { addRow(r, false); });
    addRow(boxScore.totals, true);
    table.appendChild(tbody);
    return table;
  }

  var statsOverlay = document.getElementById("stats-overlay");
  var statsContent = document.getElementById("stats-content");

  function renderStatsOverlay() {
    statsContent.innerHTML = "";

    var scoreLine = document.createElement("div");
    scoreLine.className = "stats-score-line";
    scoreLine.textContent =
      teamsById[state.match.home_team_id].name + "  " + computeScore(state.match.home_team_id) +
      " – " + computeScore(state.match.away_team_id) + "  " + teamsById[state.match.away_team_id].name;
    statsContent.appendChild(scoreLine);

    // 20 columns don't fit a phone: each table scrolls sideways on its own (the print
    // stylesheet lets it lay out in full on the landscape page).
    [state.match.home_team_id, state.match.away_team_id].forEach(function (teamId) {
      var scroller = document.createElement("div");
      scroller.className = "stats-scroll";
      scroller.appendChild(buildBoxScoreTable(teamsById[teamId].name, computeTeamBoxScore(teamId)));
      statsContent.appendChild(scroller);
    });
  }

  document.getElementById("stats-btn").addEventListener("click", function () {
    renderStatsOverlay();
    statsOverlay.classList.remove("hidden");
  });
  document.getElementById("stats-close-btn").addEventListener("click", function () {
    statsOverlay.classList.add("hidden");
  });
  document.getElementById("stats-print-btn").addEventListener("click", function () {
    window.print();
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- Boot ----------
  state = loadState();
  if (state && !isStateCompatible(state)) {
    openRecoveryModal();
  } else if (state) {
    // A match started before the starting-lineups feature existed has no onCourt field yet —
    // fall back to the first 5 rostered players per team rather than crashing on resume.
    if (!state.onCourt) {
      state.onCourt = {};
      [state.match.home_team_id, state.match.away_team_id].forEach(function (teamId) {
        state.onCourt[teamId] = playersForTeam(teamId).slice(0, 5).map(function (p) { return p.id; });
      });
      saveState();
    }
    enterTaggingScreen();
  } else {
    renderSetupScreen();
    showScreen("setup");
  }

  // Hosted build only: cache the page for offline use after the first visit (see build.py's
  // site/ output). A tagger opened as a local file has nothing to register, and secure-context
  // rules would refuse it anyway.
  if (IS_HOSTED && "serviceWorker" in navigator && window.isSecureContext) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  function shotPickerVariant() { return "freeform"; }

  function applyExportShotLocation(ev, out) {
    if (ev.shot_x !== undefined && ev.shot_y !== undefined) {
      out.shot_x = ev.shot_x;
      out.shot_y = ev.shot_y;
    }
  }

  // ---------- Freeform location modal ----------
  // Runs between the event-type tap and the assist prompt (for makes) / straight commit
  // (for misses). Tapping the court places a marker and computes 2PT/3PT live from the tapped
  // point; unlike the zone-map variant's oversized regions, a freeform tap has no built-in
  // undo, so an explicit Confirm/Retry step exists before the location is recorded. The two
  // fallback buttons still exist for when the tagger doesn't want to pinpoint a spot — points
  // must always be recorded even then.
  var zoneModal = document.getElementById("zone-modal");
  var zoneModalTitle = document.getElementById("zone-modal-title");
  var courtMapEl = document.getElementById("court-map");
  var courtReadout = document.getElementById("court-readout");
  var courtConfirmRow = document.getElementById("court-confirm-row");
  var pendingZoneEvent = null;
  var pendingZoneIsMade = false;
  var pendingLocation = null;

  // SVG's y-axis increases downward, but "logical" court y (matching analytics-project/ui.py
  // and shot_y in the export) increases away from the baseline. Everything drawn or tapped is
  // done in logical coordinates; a single flipped <g> (baseline at the bottom of the diagram,
  // like a real court) handles the visual conversion in one place.
  var courtGroupEl = null;

  function svgPointFromEvent(svg, evt) {
    var pt = svg.createSVGPoint();
    pt.x = evt.clientX;
    pt.y = evt.clientY;
    var svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
    return [svgP.x, COURT_TOP - svgP.y];
  }

  function renderCourtMap() {
    courtMapEl.innerHTML = "";
    courtGroupEl = svgEl("g", { transform: "translate(0," + COURT_TOP + ") scale(1,-1)" });
    courtMapEl.appendChild(courtGroupEl);
    var bg = svgEl("rect", { "class": "court-bg", x: 0, y: 0, width: 50, height: COURT_TOP });
    bg.addEventListener("click", function (evt) {
      var p = svgPointFromEvent(courtMapEl, evt);
      placeMarker(p[0], p[1]);
    });
    courtGroupEl.appendChild(bg);
    renderCourtLines(courtGroupEl);
  }

  function placeMarker(x, y) {
    x = Math.max(0, Math.min(50, x));
    y = Math.max(0, Math.min(COURT_TOP, y));
    pendingLocation = [x, y];
    var existing = courtGroupEl.querySelector(".court-marker");
    if (existing) existing.remove();
    courtGroupEl.appendChild(svgEl("circle", { "class": "court-marker", cx: x.toFixed(2), cy: y.toFixed(2), r: 1.1 }));
    courtReadout.textContent = t("shot.marked", { points: isThreePointer(x, y) ? 3 : 2 });
    courtConfirmRow.classList.remove("hidden");
  }

  function clearMarker() {
    pendingLocation = null;
    var existing = courtMapEl.querySelector(".court-marker");
    if (existing) existing.remove();
    courtReadout.textContent = t("shot.tapCourt");
    courtConfirmRow.classList.add("hidden");
  }

  function openZoneModal(shotEvent, isMade) {
    pendingZoneEvent = shotEvent;
    pendingZoneIsMade = isMade;
    zoneModalTitle.textContent = t("shot.where", { kind: t(isMade ? "event.score" : "event.miss") });
    renderCourtMap();
    clearMarker();
    zoneModal.classList.remove("hidden");
  }

  function finishZoneFallback(points) {
    var ev = pendingZoneEvent;
    ev.points = points;
    proceedAfterZone(ev);
  }

  function proceedAfterZone(ev) {
    var isMade = pendingZoneIsMade;
    pendingZoneEvent = null;
    pendingLocation = null;
    zoneModal.classList.add("hidden");
    if (isMade) {
      openAssistModal(ev);
    } else {
      commitEvent(ev);
    }
  }

  document.getElementById("court-confirm-btn").addEventListener("click", function () {
    if (!pendingLocation) return;
    var ev = pendingZoneEvent;
    ev.shot_x = Number(pendingLocation[0].toFixed(2));
    ev.shot_y = Number(pendingLocation[1].toFixed(2));
    ev.points = isThreePointer(pendingLocation[0], pendingLocation[1]) ? 3 : 2;
    proceedAfterZone(ev);
  });

  document.getElementById("court-retry-btn").addEventListener("click", function () {
    clearMarker();
  });

  document.getElementById("zone-fallback-2-btn").addEventListener("click", function () {
    finishZoneFallback(2);
  });
  document.getElementById("zone-fallback-3-btn").addEventListener("click", function () {
    finishZoneFallback(3);
  });
  document.getElementById("zone-cancel-btn").addEventListener("click", function () {
    pendingZoneEvent = null;
    zoneModal.classList.add("hidden");
  });
})();
</script>
</body>
</html>
